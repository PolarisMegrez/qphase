name: CI

on:
  push:
    branches: ["main", "stable"]
  pull_request:
    branches: ["main", "stable"]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # Every CI job installs the CPU-only group: it carries the CLI, GUI,
        # resource packages, docs and test tools without the CUDA stack, so
        # the matrix stays installable on interpreters that have no CuPy
        # wheel and gpu-marked cases skip through the device probe.
        run: uv sync --no-dev --group dev-cpu

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with MyPy
        # Tests are linted by ruff but not type-checked yet: mypy on tests
        # still reports the registered backlog of 74 errors.
        run: uv run mypy packages

  test:
    # Fast gate: unit tests only, on every supported interpreter.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --no-dev --group dev-cpu

      - name: Run unit tests
        run: uv run pytest -m "unit and not gpu"

  integration:
    # Cross-component suite on one interpreter; slow cases stay in `slow`.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --no-dev --group dev-cpu

      - name: Run integration tests
        run: uv run pytest -m "integration and not gpu and not slow"

  e2e:
    # CLI / workflow end-to-end suite; blocking on pushes to the main branches.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --no-dev --group dev-cpu

      - name: Run end-to-end tests
        run: uv run pytest -m "e2e and not gpu"

  slow:
    # Long-running regression sweep: pushes only, never on pull requests.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --no-dev --group dev-cpu

      - name: Run slow tests
        run: uv run pytest -m "slow and not gpu"
