jobs:
- name: collective_loss_kerr_3mode_acn_bcn_wmax_extended_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - -1.430355010777712
        - -1.4350330036701975
        - -1.4418993576780903
        - -1.4519777873793957
        - -1.4667708991389884
        - -1.4884841952718087
        - -1.520355010777712
  engine:
    sde:
      t0: 100000.0
      t1: 1300000.0
      dt: 0.04
      n_traj: 32
      seed: 20260825
      ic:
      - - 23.60218740187223+2.890434325457881e-15j
        - -3.363739683033011-0.3938218310277979j
        - -1.611490803459231+0.8754396750099066j
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 119.57177631836001
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      kappa_bright: 1.0
      omega_b: 3.1215805501915015
      omega_c: -1.4203550107777119
      chi: 5.837569923409237e-05
      g_ab: 0.4369267192725563
      g_ac: -0.10576211228805123
      g_bc: -0.021076429998524326
      pump_a: 0.022386488186053245
      kappa_dark: 2.5057901369710232e-05
  observer:
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 0.6
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 4}}
    allan_variance:
      modes: [0]
      points: 72
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_acn_bcn_wmax_extended_fit
  input: {from: collective_loss_kerr_3mode_acn_bcn_wmax_extended_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.6
      freq_max: 0.2
      fit_window: 0.2
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_acn_bcn_wmax_extended_allan
  input: {from: collective_loss_kerr_3mode_acn_bcn_wmax_extended_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: -1.4203550107777119
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.25
      min_averaging_samples: 16
      max_relative_sem: 0.35
      min_independent_windows: 16
      min_scaling_points: 5
      target_scaling_decades: 1.0
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 1000
      bootstrap_seed: 20260825
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
