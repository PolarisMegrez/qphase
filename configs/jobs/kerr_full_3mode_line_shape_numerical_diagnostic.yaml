# Reduced controls for aliasing, integrator bias, and exposure dependence.
- name: kerr_full_3mode_line_shape_stride25
  save: true
  scan: &diagnostic_scan
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [-0.985, -0.920056014795794, -0.860357599562311]
  engine:
    sde: &base_engine
      t0: 0.0
      t1: 10000.0
      dt: 0.005
      n_traj: 4
      seed: 20260808
      ic:
        - ["1.58453427+0.0j",
           "1.38582083+3.01794092j",
           "-16.71334157+0.75670294j"]
      adaptive: false
      save_stride: 25
      record_modes: [0, 1, 2]
      keep_traj: false
      max_state_norm: 20000.0
      state_check_interval_steps: 1024
  backend: &cupy_backend
    cupy:
      float_dtype: float64
      device: cuda
  integrator: &cayley_integrator
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16
  model:
    kerr_full_3mode: &candidate_model
      omega_a: 0.0
      omega_b: -0.854332923964663
      omega_c: -1.0
      chi: 0.05
      gamma_a: 4.0
      gamma_b: 1.0
      gamma_c: 0.07502418826324694
      g_ab: 1.0
      g_ac: 0.2
      g_bc: 0.2
  analyser: &diagnostic_analysers
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 4.0
      find_peaks: false
      estimator:
        periodogram: {}
    pdist:
      modes: [0, 1, 2]
      bins: 128
      density: true

- name: kerr_full_3mode_line_shape_stride100
  save: true
  scan: *diagnostic_scan
  engine:
    sde:
      <<: *base_engine
      save_stride: 100
  backend: *cupy_backend
  integrator: *cayley_integrator
  model:
    kerr_full_3mode: *candidate_model
  analyser: *diagnostic_analysers

