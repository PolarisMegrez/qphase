name: kerr_full_3mode_cam
save: true

scan:
  combine: cartesian
  axes:
    omega_b:
      target: model.kerr_full_3mode.omega_b
      linspace: {start: 1.55, stop: 1.68, num: 101}
    gamma_c:
      target: model.kerr_full_3mode.gamma_c
      linspace: {start: 0.35, stop: 0.48, num: 101}

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 1.617958768427497
      omega_c: -1.0
      chi: 0.01
      gamma_a: 3.0
      gamma_b: 1.0
      gamma_c: 0.4148645824230304
      g_ab: 1.25
      g_ac: 1.0
      g_bc: 3.0
  cam_solver:
    multistability:
      n_guesses: 50
      guess_bounds: auto
      distance_tolerance: 1.0e-3
      retry_guesses: 100
      refine_guesses: 50
  cam_postprocessor:
    rayleigh_frequency: {}
    hamiltonian_spectrum: {}
    jacobian_spectrum: {}
    physicality: {}
