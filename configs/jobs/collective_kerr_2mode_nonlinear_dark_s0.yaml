name: collective_kerr_2mode_nonlinear_dark_s0
save: true
system:
  scan_runtime:
    checkpoint:
      enabled: true
      interval_chunks: 1
      keep_on_success: false
scan:
  combine: zipped
  axes:
    delta:
      target: model.collective_kerr_2mode.delta
      values:
      - 0.18759197261252666
      - 0.6971356737131976
      - 2.8442851535835523
      - 0.14543882433828828
    g:
      target: model.collective_kerr_2mode.g
      values:
      - 0.13170426288150194
      - 2.856201952538537
      - 0.0374939977360552
      - 0.8033173178646423
    pump_bright:
      target: model.collective_kerr_2mode.pump_bright
      values:
      - 0.39514097179751845
      - 0.6921374216116964
      - 0.20907936363015325
      - 0.8985101000126451
engine:
  cam:
    case_failure_policy: record
plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    collective_kerr_2mode:
      omega_0: 0.0
      delta: 1.0
      chi: 0.001
      g: 0.5
      kappa_bright: 1.0
      pump_bright: 0.5
      kappa_dark: 0.1
  cam_solver:
    bifurcation:
      controls:
        chi:
          min: 1.0e-05
          max: 0.1
          scale: 0.01
          domain: nonnegative
          sampling: log
        kappa_dark:
          min: 0.0001
          max: 2.0
          scale: 0.1
          domain: nonnegative
          sampling: log
      perturbation:
        parameter: delta
        scale: 1.0
        side: both
      target:
        equilibrium_multiplicity:
          order: 3
      strategy:
        reduced:
          retained_dimension: 1
          max_candidates: 4
          condition_limit: 100000000000.0
      discovery:
        seeds:
          samples_per_control: 3
          max_starts: 1024
          order_parameter_samples: 31
      classifier:
        scaling_signature:
          max_total_order: 8
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement:
        tolerance: 1.0e-09
        max_iterations: 60
      verification:
        initial_digits: 40
        max_digits: 120
      audit:
        near_miss_per_reason: 8
        near_miss_total: 64
