name: kerr_2mode_saddle_node_candidate
save: true

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    kerr_2mode:
      omega_a: 0.0
      omega_b: 0.0
      gamma_a: 1.0
      gamma_b: 4.493997626671027
      chi: 0.00001
      g: 1.0640283318208101
  cam_solver:
    bifurcation:
      controls:
        omega_b: {min: -1.0, max: 1.0, scale: 1.0, domain: real}
      perturbation:
        parameter: omega_b
        scale: 1.0
        side: both
      target:
        equilibrium_multiplicity:
          order: 2
      strategy:
        auto:
          retained_dimension: 1
          max_candidates: 8
          condition_limit: 1.0e11
      discovery:
        seeds:
          samples_per_control: 17
          max_starts: 2048
          order_parameter_samples: 161
      classifier:
        scaling_signature:
          max_total_order: 6
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement:
        tolerance: 1.0e-12
        max_iterations: 150
      verification:
        initial_digits: 80
        max_digits: 200
  cam_postprocessor:
    local_response_validation:
      epsilon_min: 1.0e-10
      epsilon_max: 0.3
      epsilon_points: 33
      precision_digits: 120
      residual_tolerance: 1.0e-40
      fit_points: 7
