# Reduced SDE preflight for the positive omega_c side of the retained
# Kerr-full window-extension candidate. This is not a production exposure.
- name: kerr_full_3mode_window_extension_sim
  save: true

  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [-0.985, -0.980175282157741, -0.973798704164986,
                 -0.965371113531286, -0.95423280643774,
                 -0.939511886746409, -0.920056014795794,
                 -0.894342203342723, -0.860357599562311,
                 -0.8154419208338, -0.756079210334712,
                 -0.677622611268303, -0.573930615311313,
                 -0.436886311154778, -0.255762000368637,
                 -0.0163794433213731, 0.3]

  engine:
    sde:
      t0: 0.0
      t1: 20000.0
      dt: 0.005
      n_traj: 16
      seed: 20260807
      ic:
        - ["1.58453427+0.0j",
           "1.38582083+3.01794092j",
           "-16.71334157+0.75670294j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      max_state_norm: 20000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float64
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16

  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: -0.854332923964663
      omega_c: -1.0
      chi: 0.05
      gamma_a: 4.0
      gamma_b: 1.0
      gamma_c: 0.07502418826324694
      g_ab: 1.0
      g_ac: 0.2
      g_bc: 0.2

  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 4.0
      find_peaks: true
      estimator:
        periodogram: {}

- name: kerr_full_3mode_window_extension_fit
  input:
    from: kerr_full_3mode_window_extension_sim
    mode: dataset
  save: true

  engine:
    sde:
      mode: analyze

  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -2.0
      freq_max: 2.0
      fit_window: 0.2
      uncertainty: auto
      clip_by_std: false
      clip_sigma: 10.0
      export:
        - fit_results.csv
        - psd_merged.csv
