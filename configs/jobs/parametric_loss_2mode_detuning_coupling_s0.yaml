engine:
  cam:
    case_failure_policy: record
plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    parametric_loss_2mode:
      omega_a: 0.0
      omega_b: 0.0
      epsilon: 0.3
      g: 0.2
