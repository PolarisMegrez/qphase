name: collective_kerr_2mode_coupling_dark_s0
save: true
system:
  scan_runtime:
    checkpoint:
      enabled: true
      interval_chunks: 1
      keep_on_success: false
scan:
  combine: zipped
  axes:
    chi:
      target: model.collective_kerr_2mode.chi
      values:
      - 0.0001
      - 0.0001
      - 0.0001
      - 0.0001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01
      - 0.01
      - 0.01
      - 0.01
    delta:
      target: model.collective_kerr_2mode.delta
      values:
      - 1.6263609536515087
      - 0.2099743154525796
      - 0.13439332696907796
      - 1.3850307573634848
      - 1.6263609536515087
      - 0.2099743154525796
      - 0.13439332696907796
      - 1.3850307573634848
      - 1.6263609536515087
      - 0.2099743154525796
      - 0.13439332696907796
      - 1.3850307573634848
    pump_bright:
      target: model.collective_kerr_2mode.pump_bright
      values:
      - 0.8144046463491396
      - 0.2845280705066398
      - 0.6860264148982241
      - 0.23309735719580205
      - 0.8144046463491396
      - 0.2845280705066398
