# Long, high-trajectory negative-side validation over two epsilon decades.
- name: kerr_full_3mode_candidate1_long_2decade_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values:
          # epsilon = abs(omega_c + 1), logarithmically spaced by 10^0.2.
          - -1.00035
          - -1.000554716978202
          - -1.000879167149420
          - -1.001393375821549
          - -1.002208347991887
          - -1.0035
          - -1.005547169782021
          - -1.008791671494200
          - -1.013933758215488
          - -1.022083479918869
          - -1.035
  engine:
    sde:
      t0: 30000.0
      t1: 230000.0
      dt: 0.005
      n_traj: 64
      seed: 20260814
      ic:
        - ["2.5596906851531513+0.0j",
           "1.8244433135188922+3.6934242845205207j",
           "-23.925084375601617+0.7312746798613824j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 20000.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: -0.8282592981043274
      omega_c: -1.0
      chi: 0.01
      gamma_a: 3.0
      gamma_b: 1.0
      gamma_c: 0.06381888082869307
      g_ab: 1.0
      g_ac: 0.2
      g_bc: 0.2
  observer:
    first_passage:
      rule: state_norm
      threshold: 100.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 3.0
      find_peaks: true
      estimator:
        periodogram: {fft_chunk_trajectories: 4}

- name: kerr_full_3mode_candidate1_long_2decade_fit
  input:
    from: kerr_full_3mode_candidate1_long_2decade_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: 0.5
      freq_max: 1.5
      fit_window: 0.02
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]
