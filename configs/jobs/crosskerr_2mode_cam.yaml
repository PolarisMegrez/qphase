name: crosskerr_2mode_cam
save: true

scan:
  combine: cartesian
  axes:
    omega_b:
      target: model.crosskerr_2mode.omega_b
      linspace: {start: -0.05, stop: 0.05, num: 501}
    gamma_b:
      target: model.crosskerr_2mode.gamma_b
      linspace: {start: 0.45, stop: 0.55, num: 501}

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    crosskerr_2mode:
      omega_a: 0.0
      omega_b: -0.05
      chi: 0.01
      gamma_a: 0.5
      gamma_b: 0.4
      g: 0.5
  cam_solver:
    multistability:
      n_guesses: 50
      guess_bounds: auto
      seed: 42
      method: root
      tolerance: 1.0e-10
      residual_tolerance: 1.0e-7
      distance_tolerance: 3.0
      use_jacobian: true
      capacity_patience: 10
      n_workers: 1
      tile_workers: 24
      n_tiles: 288
      discover_seeds: true
      bounds_inference_starts: 128
      seed_search_guesses: 200
      retry_guesses: 200
      refine_suspicious: true
      refine_guesses: 50
  cam_postprocessor:
    rayleigh_frequency: {}
    hamiltonian_spectrum: {}
    jacobian_spectrum: {}
    physicality:
      residual_tolerance: 1.0e-7
