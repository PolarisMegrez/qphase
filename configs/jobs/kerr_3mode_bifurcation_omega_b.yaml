name: kerr_3mode_bifurcation_omega_b
save: true

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    kerr_3mode:
      omega_a: 0.0
      omega_b: 0.0
      omega_c: 1.0
      chi: 0.001
      gamma_a: 1.0
      gamma_b: 1.0
      gamma_c: 1.0
      g_ab: 1.0
      g_ac: 0.5
  cam_solver:
    bifurcation:
      controls:
        omega_b: {min: -1.0, max: 1.0, scale: 0.5, domain: real}
        g_ac: {min: 1.5, max: 3.5, scale: 1.0, domain: nonnegative}
      perturbation:
        parameter: omega_b
        scale: 1.0
        side: both
      target:
        equilibrium_multiplicity:
          order: 3
      strategy:
        reduced:
          retained_dimension: 1
          order_parameter: r_diag_0
          order_parameter_bounds: [0.0, 20000.0]
          max_candidates: 8
          condition_limit: 1.0e11
      discovery:
        seeds:
          samples_per_control: 5
          max_starts: 2048
          order_parameter_samples: 81
      classifier:
        scaling_signature:
          max_total_order: 8
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement:
        tolerance: 1.0e-11
        max_iterations: 100
      verification:
        initial_digits: 50
        max_digits: 200
