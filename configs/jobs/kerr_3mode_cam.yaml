name: kerr_3mode_cam
save: true

scan:
  combine: cartesian
  axes:
    omega_b:
      target: model.kerr_3mode.omega_b
      linspace: {start: -4.0, stop: 4.0, num: 201}
    gamma_c:
      target: model.kerr_3mode.gamma_c
      linspace: {start: 0.0, stop: 2.0, num: 201}

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    kerr_3mode:
      omega_a: 0.0
      omega_b: 0.0
      omega_c: 2.0
      chi: 0.001
      gamma_a: 1.0
      gamma_b: 0.5
      gamma_c: 0.5
      g_ab: 1.2
      g_ac: 1.0
  cam_solver:
    multistability:
      n_guesses: 50
      guess_bounds: auto
      seed: 42
      method: root
      tolerance: 1.0e-10
      residual_tolerance: 1.0e-7
      distance_tolerance: 3.0
      use_jacobian: true
      capacity_patience: 10
      n_workers: 1
      tile_workers: 24
      n_tiles: 288
      discover_seeds: true
      bounds_inference_starts: 128
      seed_search_guesses: 200
      retry_guesses: 200
      refine_suspicious: true
      refine_guesses: 50
  cam_postprocessor:
    rayleigh_frequency: {}
    hamiltonian_spectrum: {}
    jacobian_spectrum: {}
    physicality:
      residual_tolerance: 1.0e-7
