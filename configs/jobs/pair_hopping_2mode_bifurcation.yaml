name: pair_hopping_2mode_bifurcation
save: true

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    pair_hopping_2mode:
      omega_a: 0.0
      omega_b: 0.0
      g: 1.0
      k: 0.001
      gamma_a: 1.0
      gamma_b: 1.0
  cam_solver:
    bifurcation:
      controls:
        omega_b: {min: -1.0, max: 2.0, scale: 1.0, domain: real}
        gamma_a: {min: 0.1, max: 1.0, scale: 0.5, domain: nonnegative}
      perturbation:
        parameter: omega_b
        scale: 1.0
        side: both
      target:
        equilibrium_multiplicity:
          order: 3
      strategy:
        reduced:
          retained_dimension: 1
          order_parameter: r_re_0_1
          order_parameter_bounds: [-20.0, 20.0]
          max_candidates: 8
          condition_limit: 1.0e11
      discovery:
        seeds:
          samples_per_control: 7
          max_starts: 2048
          order_parameter_samples: 61
      classifier:
        scaling_signature:
          max_total_order: 8
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement:
        tolerance: 1.0e-11
        max_iterations: 100
      verification:
        initial_digits: 50
        max_digits: 200
