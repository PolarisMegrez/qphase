name: pair_hopping_2mode_cam
save: true

scan:
  combine: cartesian
  axes:
    omega_b:
      target: model.pair_hopping_2mode.omega_b
      linspace: {start: -0.04, stop: 0.12, num: 101}
    gamma_a:
      target: model.pair_hopping_2mode.gamma_a
      linspace: {start: 0.85, stop: 1.03, num: 101}

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    pair_hopping_2mode:
      omega_a: 0.0
      omega_b: 0.0
      g: 1.0
      k: 0.001
      gamma_a: 0.9434369986
      gamma_b: 1.0
  cam_solver:
    multistability:
      n_guesses: 4
      guess_bounds:
        diag_lower: [-50.0, -50.0]
        diag_upper: [300.0, 300.0]
        offdiag_scale: 150.0
      initial_guesses:
        - [["115.51202045+0.0j", "-70.41717080+76.18353107j"],
           ["-70.41717080-76.18353107j", "109.95003238+0.0j"]]
        - [["0.0+0.0j", "0.0+0.0j"],
           ["0.0+0.0j", "0.0+0.0j"]]
        - [["100.0+0.0j", "0.0+0.0j"],
           ["0.0+0.0j", "100.0+0.0j"]]
        - [["115.51202045+0.0j", "-63.37545372+68.56517796j"],
           ["-63.37545372-68.56517796j", "109.95003238+0.0j"]]
      seed: 42
      method: root
      tolerance: 1.0e-10
      residual_tolerance: 1.0e-7
      distance_tolerance: 1.0e-3
      use_jacobian: true
      capacity_patience: 10
      n_workers: 1
      tail_fraction: 0.1
      tail_orders: 2.0
      tile_workers: 24
      n_tiles: 144
      discover_seeds: false
      bounds_inference_starts: 64
      seed_search_guesses: 80
      retry_guesses: 32
      refine_suspicious: true
      refine_guesses: 16
  cam_postprocessor:
    rayleigh_frequency: {}
    hamiltonian_spectrum: {}
    jacobian_spectrum: {}
    physicality:
      residual_tolerance: 1.0e-7
