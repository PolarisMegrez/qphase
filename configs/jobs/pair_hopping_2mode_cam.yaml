name: pair_hopping_2mode_cam
save: true

scan:
  combine: cartesian
  axes:
    omega_b:
      target: model.pair_hopping_2mode.omega_b
      linspace: {start: 0.48, stop: 0.52, num: 201}
    gamma_a:
      target: model.pair_hopping_2mode.gamma_a
      linspace: {start: 0.88, stop: 0.92, num: 201}

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    pair_hopping_2mode:
      omega_a: 0.0
      omega_b: 0.48
      g: 1.0
      k: 0.001
      gamma_a: 0.88
      gamma_b: 3.767911788762655
  cam_solver:
    multistability:
      n_guesses: 4
      guess_bounds:
        diag_lower: [-50.0, -50.0]
        diag_upper: [300.0, 300.0]
        offdiag_scale: 150.0
      initial_guesses:
        - [["76.4822307951+0.0j", "-9.6642158551+36.0191088488j"],
           ["-9.6642158551-36.0191088488j", "18.8797949733+0.0j"]]
        - [["100.1318728121+0.0j", "-11.8153416211+47.4068959998j"],
           ["-11.8153416211-47.4068959998j", "24.5262352983+0.0j"]]
        - [["52.8325887781+0.0j", "-7.5130900891+24.6313216978j"],
           ["-7.5130900891-24.6313216978j", "13.2333546483+0.0j"]]
        - [["0.0+0.0j", "0.0+0.0j"],
           ["0.0+0.0j", "0.0+0.0j"]]
      distance_tolerance: 1.0e-3
      discover_seeds: false
      retry_guesses: 32
      refine_guesses: 16
  cam_postprocessor:
    rayleigh_frequency: {}
    hamiltonian_spectrum: {}
    jacobian_spectrum: {}
    physicality: {}
