# Bounded full-state discovery around three mechanism-deduplicated reduced-sheet
# candidates. This is a coverage audit, not a proof that singular sheets are
# exhausted.
name: kerr_full_3mode_space_filling_bordered_recheck
save: true
scan:
  combine: zipped
  axes:
    omega_c:
      target: model.kerr_full_3mode.omega_c
      values: [1.0, 1.0, -1.0]
    chi:
      target: model.kerr_full_3mode.chi
      values: [0.0001, 0.0001, 0.001]
    gamma_a:
      target: model.kerr_full_3mode.gamma_a
      values: [0.9637901114446895, 0.14604323845134595,
               1.192197479699127]
    gamma_b:
      target: model.kerr_full_3mode.gamma_b
      values: [0.20833426831502472, 0.24891807600856478,
               1.477261120722963]
    g_ab:
      target: model.kerr_full_3mode.g_ab
      values: [0.029464248258859665, 0.025434594095880288,
               1.9680780156167588]
    g_ac:
      target: model.kerr_full_3mode.g_ac
      values: [4.208110780283891, 0.48877845108598494,
               0.023357178655009744]
    g_bc:
      target: model.kerr_full_3mode.g_bc
      values: [0.03624253539123171, 0.1353225962796027,
               1.4243866723285246]
engine:
  cam:
    case_failure_policy: record
plugins:
  backend:
    numpy: {float_dtype: float64}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 0.0
      omega_c: 1.0
      chi: 0.001
      gamma_a: 1.0
      gamma_b: 1.0
      gamma_c: 1.0
      g_ab: 1.0
      g_ac: 1.0
      g_bc: 1.0
  cam_solver:
    bifurcation:
      controls:
        omega_b: {min: -5.0, max: 5.0, scale: 1.0, domain: real}
        gamma_c:
          min: 0.005
          max: 5.0
          scale: 1.0
          domain: nonnegative
          sampling: log
      perturbation: {parameter: omega_c, scale: 1.0, side: both}
      target:
        equilibrium_multiplicity: {order: 3}
      strategy:
        full: {singular_tolerance: 1.0e-10}
      discovery:
        seeds: {samples_per_control: 4, max_starts: 128,
                order_parameter_samples: 41}
      classifier:
        scaling_signature:
          max_total_order: 8
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement: {tolerance: 1.0e-10, max_iterations: 100}
      verification: {initial_digits: 60, max_digits: 200}
  cam_postprocessor:
    stochastic_validity: {probe_epsilon: 0.0001}
