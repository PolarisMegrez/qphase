# Time-step control for the controlled Kerr-full linewidth experiment. Run only
# after kerr_full_3mode_linewidth_mechanism has completed.
name: kerr_full_3mode_linewidth_mechanism_dt_half
save: true

scan:
  axes:
    omega_c:
      target: model.kerr_full_3mode.omega_c
      values: [-0.985, -0.9200560148]

engine:
  sde:
    t0: 7000.0
    t1: 25000.0
    dt: 0.0025
    n_traj: 8
    seed: 20260807
    ic:
      - ["1.58453427+0.0j",
         "1.38582083+3.01794092j",
         "-16.71334157+0.75670294j"]
    adaptive: false
    save_stride: 200
    record_modes: [0, 1, 2]
    keep_traj: true
    max_state_norm: 20000.0
    state_check_interval_steps: 2048

backend:
  cupy:
    float_dtype: float64
    device: cuda

integrator:
  cayley_maruyama:
    fused: required
    chunk_steps: 256
    max_modes: 16

model:
  kerr_full_3mode:
    omega_a: 0.0
    omega_b: -0.854332923964663
    omega_c: -1.0
    chi: 0.05
    gamma_a: 4.0
    gamma_b: 1.0
    gamma_c: 0.07502418826324694
    g_ab: 1.0
    g_ac: 0.2
    g_bc: 0.2

observer:
  first_passage:
    rule: state_norm
    threshold: 100.0
    direction: above
    action: record
    check_interval_steps: 2048
    debounce_checks: 2

analyser:
  trajectory_diagnostics:
    modes: [0, 1, 2]
    block_durations: [2500.0, 5000.0, 10000.0, 18000.0]
    coherence: true
    coherence_max_lag: 2500.0
    center_coherence: false
    keep_coherence_per_trajectory: true
    allan: true
    allan_points: 32
    allan_min_windows: 8
    amplitude_floor: 1.0e-10
    block_spectrum: true
    block_spectrum_wing_factor: 3.0
    stationarity_details: true
    matrix_projection: true
    matrix_projection_reference:
      [3.0112979606502317, 11.52973768864648, 280.4084645781052,
       2.195768860271624, -26.482681581155084, -20.87793103904687,
       -4.782776804094664, -1.1990955860289938, -51.48822824208951]
    matrix_projection_left_vector:
      [0.016815354697084495, 0.04484717207946304, 1.0687303637245125,
       0.0179095023084094, -0.20178016219108877, -0.15728360828290794,
       0.03354630302688183, 0.008935764521856503, 0.3919673755317247]
    matrix_projection_keep_coordinates: false
