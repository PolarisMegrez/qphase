name: vdp_2mode_cam
save: true

scan:
  combine: cartesian
  axes:
    omega_a:
      target: model.vdp_2mode.omega_a
      linspace: {start: -0.3, stop: 0.3, num: 101}
    gamma_b:
      target: model.vdp_2mode.gamma_b
      linspace: {start: 0.2, stop: 1.1, num: 101}

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    vdp_2mode:
      omega_a: -0.3
      omega_b: 0.0
      gamma_a: 2.0
      gamma_b: 0.2
      Gamma: 0.0001
      g: 0.5
  cam_solver:
    multistability:
      n_guesses: 50
      guess_bounds: auto
      seed: 42
      method: root
      tolerance: 1.0e-10
      residual_tolerance: 1.0e-7
      distance_tolerance: 3.0
      n_workers: 1
      tile_workers: 24
      n_tiles: 288
  cam_postprocessor:
    rayleigh_frequency: {}
    hamiltonian_spectrum: {}
    jacobian_spectrum: {}
    physicality:
      residual_tolerance: 1.0e-7
