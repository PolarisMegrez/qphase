- name: crosskerr_2mode_cayley_sim
  save: true

  scan:
    axes:
      omega_b:
        target: model.crosskerr_2mode.omega_b
        logspace: {start: -3, stop: -1, num: 31, base: 10}

  engine:
    sde:
      t0: 0.0
      t1: 100000.0
      dt: 0.5
      n_traj: 200
      seed: 42
      ic:
        - ["7.0+0.0j", "0.0+7.0j"]
      adaptive: false
      save_stride: 20
      record_modes: [0]
      keep_traj: false

  backend:
    cupy:
      float_dtype: float32
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 128
      max_modes: 16

  model:
    crosskerr_2mode:
      omega_a: 0.5
      omega_b: 0.001
      chi: 0.01
      gamma_a: 0.5
      gamma_b: 0.517926
      g: 0.5

  analyser:
    psd:
      modes: [0]
      kind: complex
      find_peaks: true

- name: crosskerr_2mode_cayley_fit
  input:
    from: crosskerr_2mode_cayley_sim
    mode: dataset
  save: true
  engine:
    sde:
      mode: analyze
  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      uncertainty: auto
      clip_by_std: true
      clip_sigma: 10.0
      export:
        - fit_results.csv
        - psd_merged.csv
