jobs:
- name: collective_loss_kerr_3mode_acn_bcp_balanced_dt004_sim
  save: true
  scan: &scan
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - -0.9618031310290098
        - -0.9834259076306936
        - -1.0518031310290098
  engine:
    sde: &engine
      t0: 10000.0
      t1: 60000.0
      dt: 0.04
      n_traj: 32
      seed: 20260821
      ic: &ic
      - - 17.5591944592998+2.150381129018744e-15j
        - -1.990262794222536-1.040430741264456j
        - -2.338638614882554+0.9553969457901852j
      adaptive: false
      save_stride: 10
      record_modes: [0, 1, 2]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 100.0
      state_check_interval_steps: 1024
  backend: &backend
    cupy: {float_dtype: float64, device: cuda}
  integrator: &integrator
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model: &model
    collective_loss_kerr_3mode:
      omega_a: 0.0
      kappa_bright: 1.0
      omega_b: 1.2
      omega_c: -0.9518031310290098
      chi: 7.510627290627429e-05
      g_ab: 0.1487705148435459
      g_ac: -0.11739474190421646
      g_bc: 0.1249446528072051
      pump_a: 0.03030664701099313
      kappa_dark: 0.00010766140657151155
  observer: &observer
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser: &analyser
    allan_variance:
      modes: [0]
      points: 40
      min_windows: 8
      min_independent_windows: 4
    coherence_matrix:
      modes: [0, 1, 2]
      time_blocks: 8
      min_block_samples: 128

- name: collective_loss_kerr_3mode_acn_bcp_balanced_dt005_sim
  save: true
  scan: *scan
  engine:
    sde:
      <<: *engine
      dt: 0.05
      save_stride: 8
  backend: *backend
  integrator: *integrator
  model: *model
  observer: *observer
  analyser: *analyser

- name: collective_loss_kerr_3mode_acn_bcp_balanced_dt008_sim
  save: true
  scan: *scan
  engine:
    sde:
      <<: *engine
      dt: 0.08
      save_stride: 5
  backend: *backend
  integrator: *integrator
  model: *model
  observer: *observer
  analyser: *analyser
