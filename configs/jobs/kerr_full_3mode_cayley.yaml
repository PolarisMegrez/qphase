- name: kerr_full_3mode_cayley_sim
  save: true

  scan:
    axes:
      omega_b:
        target: model.kerr_full_3mode.omega_b
        values: [1.607958768427497, 1.615958768427497, 1.617958768427497,
                 1.619958768427497, 1.627958768427497]

  engine:
    sde:
      t0: 0.0
      t1: 50000.0
      dt: 0.005
      n_traj: 16
      seed: 20260807
      ic:
        - ["3.811797972941656+0.0j",
           "36.38323472799914+2.0012488009650875j",
           "-57.32587256584372+3.0193784161422665j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      max_state_norm: 10000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float64
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16

  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 1.617958768427497
      omega_c: -1.0
      chi: 0.01
      gamma_a: 3.0
      gamma_b: 1.0
      gamma_c: 0.4148645824230304
      g_ab: 1.25
      g_ac: 1.0
      g_bc: 3.0

  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 6.0
      find_peaks: true
      estimator:
        periodogram: {}

- name: kerr_full_3mode_cayley_fit
  input:
    from: kerr_full_3mode_cayley_sim
    mode: dataset
  save: true

  engine:
    sde:
      mode: analyze

  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      freq_min: 2.0
      freq_max: 3.8
      fit_window: 0.02
      uncertainty: auto
      clip_by_std: false
      clip_sigma: 10.0
      export:
        - fit_results.csv
        - psd_merged.csv
