# Q0 closure for the current best CAM W_noise candidate. The interval crosses
# the predicted stochastic crossover and remains inside the deterministic
# frequency-response window.
- name: collective_loss_kerr_3mode_q0_best_w_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
          - -3.4323475095182657
          - -3.4363475095182657
          - -3.4453475095182657
          - -3.4693475095182657
          - -3.5193475095182657
  engine:
    sde:
      t0: 5000.0
      t1: 25000.0
      dt: 0.005
      n_traj: 8
      seed: 20260809
      ic:
        - - "14.8291665387201+0.0j"
          - "-10.9649545442761-0.855084962729959j"
          - "2.9835406713953-3.46476677398952j"
      adaptive: false
      save_stride: 20
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 200.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: 2.871873863041401
      omega_c: -3.4293475095182657
      chi: 0.00034170970705869376
      g_ab: 4.456013452511663
      g_ac: 0.1773645841667803
      g_bc: 0.0011725478677872413
      pump_a: 0.592924446196244
      kappa_bright: 1.0
      kappa_dark: 0.8895516330092514
  observer:
    first_passage:
      rule: state_norm
      threshold: 120.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 8.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 36
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_q0_best_w_fit
  input: {from: collective_loss_kerr_3mode_q0_best_w_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: 2.3
      freq_max: 3.6
      fit_window: 0.2
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_q0_best_w_allan
  input: {from: collective_loss_kerr_3mode_q0_best_w_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: -3.4293475095182657
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 1.0
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260809
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
