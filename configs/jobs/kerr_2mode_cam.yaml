name: kerr_2mode_cam
save: true

scan:
  combine: cartesian
  axes:
    omega_b:
      target: model.kerr_2mode.omega_b
      logspace: {start: -5, stop: -1, num: 121}
    gamma_b:
      target: model.kerr_2mode.gamma_b
      values: [1.042848239, 2.220148004]

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    kerr_2mode:
      omega_a: 0.0
      omega_b: 0.00000001
      gamma_a: 1.0
      gamma_b: 1.042848239
      chi: 0.0001
      g: 0.75
  cam_solver:
    multistability:
      n_guesses: 50
      guess_bounds: auto
      seed: 42
      method: root
      tolerance: 1.0e-10
      residual_tolerance: 1.0e-7
      distance_tolerance: 3.0
      use_jacobian: true
      capacity_patience: 10
      n_workers: 1
      tile_workers: 24
      n_tiles: 288
      discover_seeds: true
      bounds_inference_starts: 128
      seed_search_guesses: 200
      retry_guesses: 200
      refine_suspicious: true
      refine_guesses: 50
  cam_postprocessor:
    rayleigh_frequency: {}
    hamiltonian_spectrum: {}
    jacobian_spectrum: {}
    physicality:
      residual_tolerance: 1.0e-7
