- name: kerr_full_3mode_candidate1_q3_seed2_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [-1.0018, -1.0019899663557382, -1.0021999811649834,
                 -1.0026888428479344, -1.0029726148906981,
                 -1.003286335345031, -1.004016597700493,
                 -1.0044404968269537, -1.0049091329380002, -1.006,
                 -1.0066332211857941, -1.0073332705499447,
                 -1.0089628094931143, -1.0099087163023271,
                 -1.0109544511501033, -1.0133886590016434,
                 -1.0148016560898457, -1.0163637764600005, -1.02]
  engine:
    sde:
      t0: 30000.0
      t1: 130000.0
      dt: 0.005
      n_traj: 16
      seed: 20260813
      ic:
        - ["2.5596906851531513+0.0j",
           "1.8244433135188922+3.6934242845205207j",
           "-23.925084375601617+0.7312746798613824j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: true
      max_state_norm: 20000.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: -0.8282592981043274
      omega_c: -1.0
      chi: 0.01
      gamma_a: 3.0
      gamma_b: 1.0
      gamma_c: 0.06381888082869307
      g_ab: 1.0
      g_ac: 0.2
      g_bc: 0.2
  observer:
    first_passage:
      rule: state_norm
      threshold: 100.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 3.0
      find_peaks: true
      estimator:
        periodogram: {fft_chunk_trajectories: 2}
    trajectory_diagnostics:
      modes: [0]
      block_durations: [5000.0, 10000.0, 20000.0, 25000.0]
      coherence: true
      coherence_max_lag: 5000.0
      center_coherence: false
      keep_coherence_per_trajectory: true
      allan: true
      allan_points: 32
      allan_min_windows: 8
      amplitude_floor: 0.0
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true

- name: kerr_full_3mode_candidate1_q3_seed2_fit
  input:
    from: kerr_full_3mode_candidate1_q3_seed2_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: 0.5
      freq_max: 1.5
      fit_window: 0.02
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]
