name: crosskerr_2mode_bifurcation_gamma_b
save: true

scan:
  combine: cartesian
  axes:
    chi:
      target: model.crosskerr_2mode.chi
      values: [0.01, 0.001, 0.0001]
    g:
      target: model.crosskerr_2mode.g
      values: [0.5, 1.0, 2.0]

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    crosskerr_2mode:
      omega_a: 0.0
      omega_b: 0.0
      chi: 0.001
      gamma_a: 1.0
      gamma_b: 1.0
      g: 1.0
  cam_solver:
    bifurcation:
      controls:
        omega_b: {min: -2.0, max: 2.0, scale: 1.0, domain: real}
        gamma_b: {min: 0.01, max: 5.0, scale: 1.0, domain: nonnegative}
      perturbation:
        parameter: omega_b
        scale: 1.0
        side: both
      target:
        equilibrium_multiplicity:
          order: 3
      strategy:
        auto:
          retained_dimension: 1
          max_candidates: 8
          condition_limit: 1.0e11
      discovery:
        seeds:
          samples_per_control: 9
          max_starts: 4096
          order_parameter_samples: 101
      classifier:
        scaling_signature:
          max_total_order: 8
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement:
        tolerance: 1.0e-11
        max_iterations: 100
      verification:
        initial_digits: 50
        max_digits: 200
  cam_postprocessor:
    local_response_validation:
      epsilon_min: 1.0e-12
      epsilon_max: 1.0e-4
      epsilon_points: 9
      precision_digits: 100
      residual_tolerance: 1.0e-40
      fit_points: 4
    stochastic_validity:
      probe_epsilon: 1.0e-4
