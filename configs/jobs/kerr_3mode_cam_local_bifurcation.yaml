name: kerr_3mode_cam_local_bifurcation
save: true

scan:
  combine: cartesian
  axes:
    omega_b:
      target: model.kerr_3mode.omega_b
      linspace: {start: 0.10, stop: 0.28, num: 81}
    g_ac:
      target: model.kerr_3mode.g_ac
      linspace: {start: 2.20, stop: 2.65, num: 81}

engine:
  cam: {}

plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    kerr_3mode:
      omega_a: 0.0
      omega_b: 0.1925469337
      omega_c: 1.0
      chi: 0.001
      gamma_a: 1.0
      gamma_b: 1.0
      gamma_c: 1.0
      g_ab: 1.0
      g_ac: 2.4243495249
  cam_solver:
    multistability:
      n_guesses: 4
      guess_bounds:
        diag_lower: [-100.0, -100.0, -100.0]
        diag_upper: [10000.0, 10000.0, 10000.0]
        offdiag_scale: 6000.0
      initial_guesses:
        - [["2337.27307214+0.0j", "-2334.40857861+2423.10664373j", "-3819.06720866-1481.42548875j"],
           ["-2334.40857861-2423.10664373j", "4846.71328745+0.0j", "2279.21002049+5440.60346672j"],
           ["-3819.06720866+1481.42548875j", "2279.21002049-5440.60346672j", "7182.48635959+0.0j"]]
        - [["0.0+0.0j", "0.0+0.0j", "0.0+0.0j"],
           ["0.0+0.0j", "0.0+0.0j", "0.0+0.0j"],
           ["0.0+0.0j", "0.0+0.0j", "0.0+0.0j"]]
        - [["2500.0+0.0j", "0.0+0.0j", "0.0+0.0j"],
           ["0.0+0.0j", "5000.0+0.0j", "0.0+0.0j"],
           ["0.0+0.0j", "0.0+0.0j", "7500.0+0.0j"]]
      distance_tolerance: 1.0e-3
      discover_seeds: false
      retry_guesses: 32
      refine_guesses: 16
  cam_postprocessor:
    rayleigh_frequency: {}
    hamiltonian_spectrum: {}
    jacobian_spectrum: {}
    physicality: {}
