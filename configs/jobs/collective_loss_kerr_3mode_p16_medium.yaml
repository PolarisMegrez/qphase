# Two-decade, medium-cost diagnostic of the stochastic p ~= 1/6 window.
- name: collective_loss_kerr_3mode_p16_medium_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
          - 1.097746828407049
          - 1.098525107817088
          - 1.099909106067217
          - 1.102370241658953
          - 1.106746828407049
          - 1.114529622507438
          - 1.128369605008733
          - 1.152980960926084
          - 1.196746828407049
  engine:
    sde:
      t0: 50000.0
      t1: 350000.0
      dt: 0.01
      n_traj: 24
      seed: 20260813
      ic:
        - - "27.0599131679081+0.0j"
          - "5.58509248890524-3.05307386623884j"
          - "-10.3465690654246-1.61735544168341j"
      adaptive: false
      save_stride: 50
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 180.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: -0.01808028668165207
      omega_c: 1.0967468284070492
      chi: 3.548688561976006e-05
      g_ab: 0.02159812544043017
      g_ac: 0.5127408501488523
      g_bc: 0.0021544100365580555
      pump_a: 0.06607627469692187
      kappa_bright: 1.0
      kappa_dark: 0.2047542136164718
  observer:
    first_passage:
      rule: state_norm
      threshold: 120.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 4.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 56
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_p16_medium_fit
  input: {from: collective_loss_kerr_3mode_p16_medium_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.2
      freq_max: 0.5
      fit_window: 0.15
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_p16_medium_allan
  input: {from: collective_loss_kerr_3mode_p16_medium_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: 1.0967468284070492
      side: positive
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.25
      min_averaging_samples: 16
      max_relative_sem: 0.35
      min_independent_windows: 16
      min_scaling_points: 5
      target_scaling_decades: 1.3
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 2000
      bootstrap_seed: 20260813
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
