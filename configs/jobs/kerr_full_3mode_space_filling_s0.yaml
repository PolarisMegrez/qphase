engine:
  cam:
    case_failure_policy: record
plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 0.0
      omega_c: -1.0
      chi: 0.001
      gamma_a: 1.0
      gamma_b: 1.0
      gamma_c: 1.0
      g_ab: 1.0
      g_ac: 1.0
      g_bc: 1.0
  cam_solver:
    bifurcation:
      controls:
        omega_b:
          min: -5.0
          max: 5.0
          scale: 1.0
          domain: real
        gamma_c:
          min: 0.005
          max: 5.0
          scale: 1.0
          domain: nonnegative
          sampling: log
      perturbation:
        parameter: omega_c
        scale: 1.0
        side: both
      target:
        equilibrium_multiplicity:
          order: 3
      strategy:
        reduced:
          retained_dimension: 1
          max_candidates: 4
          condition_limit: 100000000000.0
      discovery:
        seeds:
          samples_per_control: 3
          max_starts: 1024
          order_parameter_samples: 31
      classifier:
        scaling_signature:
          max_total_order: 8
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement:
        tolerance: 1.0e-09
        max_iterations: 60
      verification:
        initial_digits: 40
        max_digits: 120
