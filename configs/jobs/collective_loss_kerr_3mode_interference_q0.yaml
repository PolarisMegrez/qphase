# Q0 SDE closure for the signed-coupling interference campaign. These jobs
# calibrate CAM window estimates; they are not formal exponent measurements.
- name: collective_loss_kerr_3mode_interference_acn_bcp_q0_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
          - 0.8651141178607941
          - 0.8601141178607941
          - 0.845114117860794
          - 0.820114117860794
          - 0.7701141178607941
  engine:
    sde:
      t0: 50000.0
      t1: 200000.0
      dt: 0.04
      n_traj: 8
      seed: 20260819
      ic:
        - - "10.89807602577857+0.0j"
          - "3.386941445489187+0.1514469642114536j"
          - "-1.244045831092659+0.462640578990117j"
      adaptive: false
      save_stride: 20
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 100.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: -0.03533884502840953
      omega_c: 0.8701141178607941
      chi: 0.0003870017066438336
      g_ab: 0.20480765401994
      g_ac: -0.338636742088484
      g_bc: 1.292146315861397
      pump_a: 0.02286003090752428
      kappa_bright: 1.0
      kappa_dark: 0.023307346021539846
  observer:
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 1.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 40
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_interference_acn_bcp_q0_fit
  input:
    from: collective_loss_kerr_3mode_interference_acn_bcp_q0_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.7
      freq_max: -0.1
      fit_window: 0.15
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_interference_acn_bcp_q0_allan
  input:
    from: collective_loss_kerr_3mode_interference_acn_bcp_q0_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: 0.8701141178607941
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 0.7
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260819
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}

