engine:
  cam:
    case_failure_policy: record
plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    parametric_loss_2mode:
      omega_a: 0.0
      omega_b: 0.0
      epsilon: 0.3
      g: 0.2
      kappa_a: 0.5
      kappa_b: 1.0
      kappa_2: 0.01
  cam_solver:
    bifurcation:
      controls:
        epsilon:
          min: 0.001
          max: 5.0
          scale: 0.5
          domain: nonnegative
          sampling: log
        kappa_a:
          min: 0.2
          max: 5.0
          scale: 1.0
          domain: nonnegative
          sampling: log
      perturbation:
        parameter: omega_b
        scale: 1.0
        side: both
      target:
        equilibrium_multiplicity:
          order: 3
      strategy:
        auto:
          retained_dimension: 1
          max_candidates: 4
          condition_limit: 100000000000.0
      discovery:
        seeds:
          samples_per_control: 3
          max_starts: 1024
          order_parameter_samples: 31
      classifier:
        scaling_signature:
          max_total_order: 8
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement:
        tolerance: 1.0e-11
        max_iterations: 100
      verification:
        initial_digits: 60
        max_digits: 180
      audit:
        near_miss_per_reason: 8
        near_miss_total: 64
  cam_postprocessor:
    local_response_validation:
      epsilon_min: 1.0e-10
      epsilon_max: 0.1
      epsilon_points: 19
      fit_points: 7
      precision_digits: 80
      residual_tolerance: 1.0e-30
