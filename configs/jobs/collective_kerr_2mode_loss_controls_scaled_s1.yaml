engine:
  cam:
    case_failure_policy: record
plugins:
  backend:
    numpy:
      float_dtype: float64
  model:
    collective_kerr_2mode:
      omega_0: 0.0
      delta: 1.0
      chi: 0.001
      g: 0.5
      kappa_bright: 1.0
      pump_bright: 0.5
      kappa_dark: 0.1
  cam_solver:
    bifurcation:
      controls:
        pump_bright:
          min: 0.01
          max: 0.999
          scale: 1.0
          domain: nonnegative
        kappa_dark:
          min: 0.0001
          max: 2.0
          scale: 0.1
          domain: nonnegative
          sampling: log
      perturbation:
        parameter: delta
        scale: 1.0
        side: both
      target:
        equilibrium_multiplicity:
          order: 3
      strategy:
        reduced:
          retained_dimension: 1
          max_candidates: 9
          condition_limit: 100000000000.0
      discovery:
        seeds:
          samples_per_control: 4
          max_starts: 2048
          order_parameter_samples: 41
      classifier:
        scaling_signature:
          max_total_order: 8
          coefficient_tolerance: 1.0e-14
          max_exponent: 0.999
      refinement:
        tolerance: 1.0e-11
        max_iterations: 120
      verification:
        initial_digits: 60
        max_digits: 240
      audit:
        near_miss_per_reason: 8
        near_miss_total: 64
  cam_postprocessor:
    local_response_validation:
      epsilon_min: 1.0e-10
      epsilon_max: 0.01
      epsilon_points: 13
      fit_points: 5
      precision_digits: 80
      residual_tolerance: 1.0e-30
    stochastic_validity:
      probe_epsilon: 0.0001
