# Integration-step convergence before extending the inner Allan observation.
- name: collective_loss_kerr_3mode_p16_dt001_sim
  save: true
  scan: &scan
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values: [1.097746828407049, 1.106746828407049, 1.196746828407049]
  engine:
    sde: &engine_dt001
      t0: 50000.0
      t1: 150000.0
      dt: 0.01
      n_traj: 16
      seed: 20260815
      ic: &ic
        - - "27.0599131679081+0.0j"
          - "5.58509248890524-3.05307386623884j"
          - "-10.3465690654246-1.61735544168341j"
      adaptive: false
      save_stride: 80
      record_modes: [0, 1, 2]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 180.0
      state_check_interval_steps: 1024
  backend: &backend
    cupy: {float_dtype: float64, device: cuda}
  integrator: &integrator
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model: &model
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: -0.01808028668165207
      omega_c: 1.0967468284070492
      chi: 3.548688561976006e-05
      g_ab: 0.02159812544043017
      g_ac: 0.5127408501488523
      g_bc: 0.0021544100365580555
      pump_a: 0.06607627469692187
      kappa_bright: 1.0
      kappa_dark: 0.2047542136164718
  observer: &observer
    first_passage:
      rule: state_norm
      threshold: 120.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser: &analyser
    allan_variance:
      modes: [0]
      points: 44
      min_windows: 8
      min_independent_windows: 4
    coherence_matrix:
      modes: [0, 1, 2]
      time_blocks: 8
      min_block_samples: 128

- name: collective_loss_kerr_3mode_p16_dt002_sim
  save: true
  scan: *scan
  engine:
    sde:
      <<: *engine_dt001
      dt: 0.02
      save_stride: 40
  backend: *backend
  integrator: *integrator
  model: *model
  observer: *observer
  analyser: *analyser

- name: collective_loss_kerr_3mode_p16_dt004_sim
  save: true
