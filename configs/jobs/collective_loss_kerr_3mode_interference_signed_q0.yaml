jobs:
- name: collective_loss_kerr_3mode_acn_bcn_balanced_v_q0_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - -1.8638128414796058
        - -1.8728649992173114
        - -1.887470326163888
        - -1.9110354894539456
        - -1.9490570224821568
  engine:
    sde:
      t0: 50000.0
      t1: 200000.0
      dt: 0.04
      n_traj: 8
      seed: 20260820
      ic:
      - - 12.67624662084742+0j
        - -0.916098494733234-0.3282850501276212j
        - -1.213010193425024+0.276810748328814j
      adaptive: false
      save_stride: 10
      record_modes:
      - 0
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 100.0
      state_check_interval_steps: 1024
  backend:
    cupy:
      float_dtype: float64
      device: cuda
  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      kappa_bright: 1.0
      omega_b: 1.7040472151711583
      omega_c: -1.8490570224821568
      chi: 0.00031315939393390603
      g_ab: 0.1151042250131654
      g_ac: -0.18841344313382216
      g_bc: -0.018265558598118153
      pump_a: 0.014102831238454397
      kappa_dark: 0.05351278160863972
  observer:
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes:
      - 0
      kind: complex
      convention: symmetric
      expected_freq_max: 6.0
      find_peaks: true
      estimator:
        periodogram:
          fft_chunk_trajectories: 2
    allan_variance:
      modes:
      - 0
      points: 56
      min_windows: 8
      min_independent_windows: 4
- name: collective_loss_kerr_3mode_acn_bcn_balanced_v_q0_fit
  input:
    from: collective_loss_kerr_3mode_acn_bcn_balanced_v_q0_sim
    mode: dataset
  save: true
  engine:
    sde:
      mode: analyze
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -6.0
      freq_max: 6.0
      fit_window: 0.2
      uncertainty: auto
      clip_by_std: false
      export:
