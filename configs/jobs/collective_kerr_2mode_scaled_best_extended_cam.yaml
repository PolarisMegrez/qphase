name: collective_kerr_2mode_scaled_best_extended_cam
save: true
engine:
  cam:
    case_failure_policy: record
backend:
  numpy:
    float_dtype: float64
model:
  collective_kerr_2mode:
    omega_0: 0.0
    delta: 0.06619930503321068
    chi: 0.001
    g: 0.02447886238939177
    kappa_bright: 1.0
    pump_bright: 0.9966864496227054
    kappa_dark: 0.06837056523833632
cam_solver:
  bifurcation:
    controls:
      g:
        min: 0.005
        max: 5.0
        scale: 0.2
        domain: nonnegative
        sampling: log
      pump_bright:
        min: 0.001
        max: 0.999
        scale: 1.0
        domain: nonnegative
    perturbation:
      parameter: delta
      scale: 1.0
      side: both
    target:
      equilibrium_multiplicity:
        order: 3
    strategy:
      reduced:
        retained_dimension: 1
        max_candidates: 9
        condition_limit: 1.0e11
    discovery:
      seeds:
        samples_per_control: 4
        max_starts: 2048
        order_parameter_samples: 41
    classifier:
      scaling_signature:
        max_total_order: 8
        coefficient_tolerance: 1.0e-14
        max_exponent: 0.999
    refinement:
      tolerance: 1.0e-11
      max_iterations: 120
    verification:
      initial_digits: 60
      max_digits: 240
    audit:
      near_miss_per_reason: 8
      near_miss_total: 64
cam_postprocessor:
  local_response_validation:
    epsilon_min: 1.0e-8
    epsilon_max: 0.5
    epsilon_points: 25
    fit_points: 7
    precision_digits: 80
    residual_tolerance: 1.0e-30
  stochastic_validity:
    probe_epsilon: 1.0e-4
