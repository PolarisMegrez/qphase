jobs:
- name: collective_loss_kerr_3mode_acn_bcn_coupling_pair_long_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - -3.6886587722599504
        - -3.693336765152436
        - -3.700203119160329
        - -3.7102815488616343
        - -3.725074660621227
        - -3.7467879567540474
        - -3.7786587722599507
  engine:
    sde:
      t0: 50000.0
      t1: 650000.0
      dt: 0.04
      n_traj: 32
      seed: 20260823
      ic:
      - - 21.66081111355978+2.65268429971564e-15j
        - -7.957828100074757-0.7289132520942073j
        - -6.055950149287163+1.01685220532417j
      adaptive: false
      save_stride: 50
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 119.45266858832173
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      kappa_bright: 1.0
      omega_b: 4.57631291821599
      omega_c: -3.6786587722599506
      chi: 0.00015552967217389842
      g_ab: 1.7625471351281905
      g_ac: -0.9676267903181648
      g_bc: -0.0012253845492524878
      pump_a: 0.20900520534013312
      kappa_dark: 0.0002023324974913197
  observer:
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 1.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 4}}
    allan_variance:
      modes: [0]
      points: 64
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_acn_bcn_coupling_pair_long_fit
  input: {from: collective_loss_kerr_3mode_acn_bcn_coupling_pair_long_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.6
      freq_max: 0.4
      fit_window: 0.25
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_acn_bcn_coupling_pair_long_allan
  input: {from: collective_loss_kerr_3mode_acn_bcn_coupling_pair_long_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: -3.6786587722599506
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.25
      min_averaging_samples: 16
      max_relative_sem: 0.35
      min_independent_windows: 16
      min_scaling_points: 5
      target_scaling_decades: 1.0
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 1000
      bootstrap_seed: 20260823
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
