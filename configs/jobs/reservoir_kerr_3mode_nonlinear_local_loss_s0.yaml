      - -1.2466556672006845
    g:
      target: model.reservoir_kerr_3mode.g
      values:
      - 0.016348987121801214
      - 0.353449074828063
      - 0.09876196234991194
      - 1.9263642177902311
    g_r:
      target: model.reservoir_kerr_3mode.g_r
      values:
      - 0.03171460219856813
      - 1.250311994621101
      - 0.14353648176622322
      - 0.2513604738397902
