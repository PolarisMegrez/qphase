- name: pair_hopping_2mode_q0_best_w_sim
  save: true
  scan:
    axes:
      omega_b:
        target: model.pair_hopping_2mode.omega_b
        values:
          - 2.493175561936861
          - 2.502175561936861
          - 2.505775561936861
          - 2.507175561936861
          - 2.507775561936861
          - 2.508575561936861
          - 2.510175561936861
          - 2.518175561936861
          - 2.558175561936861
          - 2.708175561936861
  engine:
    sde:
      t0: 5000.0
      t1: 55000.0
      dt: 0.02
      n_traj: 8
      seed: 20260809
      ic:
        - ["2.345571679390993+0.0j",
           "-0.40190741289766785-0.39211183749403083j"]
      adaptive: false
      save_stride: 10
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 30.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    pair_hopping_2mode:
      omega_a: 0.0
      omega_b: 2.508175561936861
      g: 1.0
      k: 0.08401112066275332
      gamma_a: 0.20939586663710635
      gamma_b: 3.5787844464739855
  observer:
    first_passage:
      rule: state_norm
      threshold: 20.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 5.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 36
      min_windows: 8
      min_independent_windows: 4
    trajectory_diagnostics:
      modes: [0]
      block_durations: [1000.0, 5000.0]
      coherence: true
      coherence_max_lag: 1000.0
      center_coherence: false
      keep_coherence_per_trajectory: false
      allan: false
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true

- name: pair_hopping_2mode_q0_best_w_lorentz
  input: {from: pair_hopping_2mode_q0_best_w_sim, mode: dataset}
  save: true
  engine: {sde: {mode: analyze}}
  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      freq_min: -0.3
      freq_max: 0.6
      fit_window: 0.2
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: pair_hopping_2mode_q0_best_w_allan_negative
  input: {from: pair_hopping_2mode_q0_best_w_sim, mode: dataset}
  save: true
  engine: {sde: {mode: analyze}}
  analyser:
    allan_scaling: &allan_scaling
      scan_param: omega_b
      critical_value: 2.508175561936861
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.25
      white_slope_max: -0.75
      min_local_r2: 0.8
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 0.5
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260809
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}

- name: pair_hopping_2mode_q0_best_w_allan_positive
  input: {from: pair_hopping_2mode_q0_best_w_sim, mode: dataset}
  save: true
  engine: {sde: {mode: analyze}}
  analyser:
    allan_scaling:
      <<: *allan_scaling
      side: positive
