# Allan Q0 for the best scaled-detuning root. The negative side stops before
# the exchange-symmetric delta=0 degeneracy.
- name: collective_kerr_2mode_scaled_best_allan_q0_sim
  save: true
  scan:
    axes:
      delta:
        target: model.collective_kerr_2mode.delta
        values:
          - 0.016199305033210681
          - 0.038082238773693225
          - 0.050387916732368788
          - 0.05730790798301607
          - 0.061199305033210687
          - 0.063387598407258938
          - 0.064618166203126493
          - 0.065310165328191228
          - 0.065699305033210684
          - 0.067199305033210685
          - 0.067977584443249611
          - 0.069361582693379067
          - 0.071822718285114176
          - 0.076199305033210679
          - 0.083982099133599913
          - 0.097822081634894475
          - 0.12243343755224559
          - 0.16619930503321068
  engine:
    sde:
      t0: 5000.0
      t1: 25000.0
      dt: 0.005
      n_traj: 16
      seed: 20260810
      ic: [["5.143963+0.0j", "7.309323+3.140553j"]]
      adaptive: false
      save_stride: 20
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 100.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_kerr_2mode:
      omega_0: 0.0
      delta: 0.06619930503321068
      chi: 0.001
      g: 0.02447886238939177
      kappa_bright: 1.0
      pump_bright: 0.9966864496227054
      kappa_dark: 0.06837056523833632
  observer:
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    allan_variance:
      modes: [0]
      points: 36
      min_windows: 8
      min_independent_windows: 4

- name: collective_kerr_2mode_scaled_best_allan_q0_negative
  input: {from: collective_kerr_2mode_scaled_best_allan_q0_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling: &allan_scaling
      scan_param: delta
      critical_value: 0.06619930503321068
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 1.0
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260810
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}

- name: collective_kerr_2mode_scaled_best_allan_q0_positive
  input: {from: collective_kerr_2mode_scaled_best_allan_q0_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      <<: *allan_scaling
      side: positive

