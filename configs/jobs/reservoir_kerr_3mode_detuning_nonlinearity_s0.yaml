name: reservoir_kerr_3mode_detuning_nonlinearity_s0
save: true
system:
  scan_runtime:
    checkpoint:
      enabled: true
      interval_chunks: 1
      keep_on_success: false
scan:
  combine: zipped
  axes:
    delta:
      target: model.reservoir_kerr_3mode.delta
      values:
      - 0.8638410872226738
      - 0.35335394788938024
      - 0.09184754675556074
      - 2.2296435328448414
    g:
      target: model.reservoir_kerr_3mode.g
      values:
      - 0.06251776338808095
      - 1.14701286878195
      - 0.017009475162066193
      - 0.45466329894577595
    g_r:
      target: model.reservoir_kerr_3mode.g_r
      values:
      - 1.4400015020407355
      - 0.06756480255676718
      - 0.6113753228018175
      - 0.02867481730104755
    pump_r:
      target: model.reservoir_kerr_3mode.pump_r
      values:
      - 0.4664699236769229
      - 0.6963044780679047
      - 0.06408198656048625
      - 0.7908653274411336
    kappa_local:
      target: model.reservoir_kerr_3mode.kappa_local
