# Short ensemble-coherence scan around the collective-loss Kerr p ~= 1/6 point.
- name: collective_loss_kerr_3mode_p16_coherence_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
          - 1.096846828407049
          - 1.097063056173066
          - 1.097746828407049
          - 1.099909106067217
          - 1.106746828407049
          - 1.128369605008733
          - 1.196746828407049
  engine:
    sde:
      t0: 30000.0
      t1: 50000.0
      dt: 0.01
      n_traj: 128
      seed: 20260814
      ic:
        - - "27.0599131679081+0.0j"
          - "5.58509248890524-3.05307386623884j"
          - "-10.3465690654246-1.61735544168341j"
      adaptive: false
      save_stride: 50
      record_modes: [0, 1, 2]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 180.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: -0.01808028668165207
      omega_c: 1.0967468284070492
      chi: 3.548688561976006e-05
      g_ab: 0.02159812544043017
      g_ac: 0.5127408501488523
      g_bc: 0.0021544100365580555
      pump_a: 0.06607627469692187
      kappa_bright: 1.0
      kappa_dark: 0.2047542136164718
  observer:
    first_passage:
      rule: state_norm
      threshold: 120.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    coherence_matrix:
      modes: [0, 1, 2]
      time_blocks: 8
      min_block_samples: 256
      confidence_level: 0.95
