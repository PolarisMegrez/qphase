schema: qphase.workflow/2
id: collective_vdp_2mode_candidate1_phase_allan_a5000_seed_b
title: Collective-Loss VDP Dimer Candidate 1 Phase/Allan A5000 Seed B
collection: collective_vdp_2mode
tags:
- model:collective_vdp_2mode
- candidate:candidate-1
- purpose:validation/phase-allan

jobs:
- &phase_allan_sim
  name: collective_vdp_2mode_candidate1_phase_allan_seed_b_sim
  save: true
  system:
    scan_runtime:
      storage_layout: auto
      auto_shard_threshold_mib: 512
      shard_target_mib: 256
      checkpoint: {enabled: true, interval_chunks: 1, keep_on_success: false}
      resources: {gpu_memory_fraction: 0.85}
  scan: &phase_allan_scan
    axes:
      omega_b:
        target: model.collective_vdp_2mode.omega_b
        # Twenty logarithmic points on the stable negative branch.
        values:
        - -0.0008
        - -0.001019419988562507
        - -0.0012990213913509775
        - -0.0016553104648918317
        - -0.0021093207189842866
        - -0.0026878546290270257
        - -0.0034250659189755147
        - -0.0043644758249348154
        - -0.0055615423694204847
        - -0.0070869343232806605
        - -0.009030703133477513
        - -0.011507599106301305
        - -0.014663845686659486
        - -0.01868577175272098
        - -0.023810811533050542
        - -0.030341521525858
        - -0.038663441908574014
        - -0.049267856885282117
        - -0.06278079762811689
        - -0.08
  engine:
    sde: &phase_allan_sde
      t0: 5000.0
      t1: 205000.0
      dt: 0.04
      n_traj: 128
      seed: 202610034
      ic:
      - - "161.25963169+0.0j"
        - "-50.5018721-169.03470011j"
      adaptive: false
      save_stride: 20
      record_modes: [0, 1]
      keep_traj: false
      trajectory_batching: required
      trajectory_batch_size: 64
      max_state_norm: 600.0
      state_check_interval_steps: 2048
  backend: &phase_allan_backend
    cupy: {float_dtype: float64, device: cuda}
  integrator: &phase_allan_integrator
    cayley_maruyama: {fused: required, chunk_steps: 2048, max_modes: 16}
  model: &phase_allan_model
    collective_vdp_2mode:
      omega_a: 0.4919370522999223
      omega_b: 0.0
      Gamma: 3.0658145008312856e-05
      g: 0.21087965229808767
      pump_a: 2.3801279660479664
      kappa_bright: 1.0
      kappa_dark: 1.4540662572435086e-04
  observer: &phase_allan_observer
    first_passage:
      rule: state_norm
      threshold: 400.0
      direction: above
      action: record
      check_interval_steps: 2048
      debounce_checks: 2
  analyser: &phase_allan_analysers
    allan_variance:
      modes: [0]
      points: 72
      min_windows: 8
      min_independent_windows: 4
      transfer_chunk_samples: 65536
      device_chunk_trajectories: 16
    coherence_matrix:
      modes: [0, 1]
      time_blocks: 32
      time_chunk_samples: 65536
    moment_statistics:
      modes: [0, 1]
      time_blocks: 32
      time_chunk_samples: 65536

- &phase_allan_fit
  name: collective_vdp_2mode_candidate1_phase_allan_seed_b_fit
  input:
    from: collective_vdp_2mode_candidate1_phase_allan_seed_b_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling: &phase_allan_fit_config
      scan_param: omega_b
      critical_value: 0.0
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.3
      min_averaging_samples: 16
      max_relative_sem: 0.35
      min_independent_windows: 16
      min_scaling_points: 6
      target_scaling_decades: 1.5
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 2000
      bootstrap_seed: 202610034
      fit_frequency: true
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
