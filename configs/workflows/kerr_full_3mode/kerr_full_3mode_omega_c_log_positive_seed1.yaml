schema: qphase.workflow/2
id: kerr_full_3mode_omega_c_log_positive_seed1
title: Kerr Full 3Mode Omega C Log Positive Seed1
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# Retained control run for the Kerr-full baseline. No positive-side joint
# frequency/linewidth scaling window was accepted on 1.0e-4...2.0e-2.
- name: kerr_full_3mode_omega_c_log_positive_seed1_sim
  save: true

  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [-0.9999, -0.999875297187122, -0.999844492084603, -0.999806077255251,
            -0.999758172882488, -0.99969843478216, -0.999623939690691, -0.999531042216174,
            -0.999415196452357, -0.999270733526278, -0.999090584193892, -0.998865932909024,
            -0.998585786437627, -0.998236435907616, -0.997800785969887, -0.997257518243238,
            -0.996580048106647, -0.995735223789908, -0.994681704103055, -0.993367935419324,
            -0.991729628916, -0.989686614622788, -0.987138918331649, -0.983961869393005, -0.98]

  engine:
    sde:
      t0: 0.0
      t1: 100000.0
      dt: 0.005
      n_traj: 16
      seed: 20260807
      ic:
      - ["2.5596906851531513+0.0j", "1.8244433135188922+3.6934242845205207j", "-23.925084375601617+0.7312746798613824j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      max_state_norm: 20000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float64
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16

  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: -0.8282592981043274
      omega_c: -1.0
      chi: 0.01
      gamma_a: 3.0
      gamma_b: 1.0
      gamma_c: 0.06381888082869307
      g_ab: 1.0
      g_ac: 0.2
      g_bc: 0.2

  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 3.0
      find_peaks: true
      estimator:
        periodogram: {}

- name: kerr_full_3mode_omega_c_log_positive_seed1_fit
  input:
    from: kerr_full_3mode_omega_c_log_positive_seed1_sim
    mode: dataset
  save: true

  engine:
    sde:
      mode: analyze

  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -1.5
      freq_max: -0.5
      fit_window: 0.02
      uncertainty: auto
      clip_by_std: false
      clip_sigma: 10.0
      export: [fit_results.csv, psd_merged.csv]
