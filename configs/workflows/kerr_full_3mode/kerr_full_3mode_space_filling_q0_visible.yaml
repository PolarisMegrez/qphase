schema: qphase.workflow/2
id: kerr_full_3mode_space_filling_q0_visible
title: Kerr Full 3Mode Space Filling Q0 Visible
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# S1 Pareto representative: strong observable/physical margin, case 166/candidate 44.
- name: kerr_full_3mode_space_filling_q0_visible_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [1.0002, 1.00053182958969, 1.00141421356237, 1.00376060309309, 1.01]
  engine:
    sde:
      t0: 5000.0
      t1: 25000.0
      dt: 0.005
      n_traj: 8
      seed: 20260808
      ic:
      - ["7.6006783622529355+0.0j", "3.3223268305225857+0.04907672681344105j", "-3.9446815521073213+0.04459808175505287j"]
      adaptive: false
      save_stride: 50
      record_modes: [0]
      keep_traj: true
      max_state_norm: 2000.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: -1.3598710890337724
      omega_c: 1.0
      chi: 0.01
      gamma_a: 0.03159917109823763
      gamma_b: 0.011216945523111069
      gamma_c: 0.032090744507992215
      g_ab: 0.01550389286028423
      g_ac: 2.6522964531097153
      g_bc: 0.16498631337966885
  observer:
    first_passage:
      rule: state_norm
      threshold: 100.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 3.0
      find_peaks: true
      estimator: {periodogram: {}}
    trajectory_diagnostics:
      modes: [0]
      block_durations: [2000.0, 5000.0]
      coherence: true
      coherence_max_lag: 1000.0
      center_coherence: false
      keep_coherence_per_trajectory: true
      allan: true
      allan_points: 24
      allan_min_windows: 8
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true

- name: kerr_full_3mode_space_filling_q0_visible_fit
  input: {from: kerr_full_3mode_space_filling_q0_visible_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.6
      freq_max: 1.5
      fit_window: 0.05
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]
