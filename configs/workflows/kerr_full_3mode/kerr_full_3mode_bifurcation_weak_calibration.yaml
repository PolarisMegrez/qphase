schema: qphase.workflow/2
id: kerr_full_3mode_bifurcation_weak_calibration
title: Kerr Full 3Mode Bifurcation Weak Calibration
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
- name: kerr_full_3mode_bifurcation_weak_calibration
  save: true

  engine:
    cam: {}

  plugins:
    backend:
      numpy:
        float_dtype: float64
    model:
      kerr_full_3mode:
        omega_a: 0.0
        omega_b: 1.0
        omega_c: -0.618062721703
        chi: 0.00618062721703
        gamma_a: 1.85418816511
        gamma_b: 0.618062721703
        gamma_c: 0.256412332936
        g_ab: 0.772578402128
        g_ac: 0.618062721703
        g_bc: 1.85418816511
    cam_solver:
      bifurcation:
        controls:
          gamma_a:
            min: 1.5
            max: 2.2
            scale: 1.85
            domain: nonnegative
          gamma_c:
            min: 0.1
            max: 0.6
            scale: 0.26
            domain: nonnegative
            sampling: log
        perturbation:
          parameter: omega_b
          scale: 1.0
          side: both
        target:
          equilibrium_multiplicity:
            order: 3
        strategy:
          reduced:
            retained_dimension: 1
            order_parameter: r_diag_0
            order_parameter_bounds: [0.0, 200.0]
            max_candidates: 8
            condition_limit: 1.0e11
        discovery:
          seeds:
            samples_per_control: 7
            max_starts: 8192
            order_parameter_samples: 101
        classifier:
          scaling_signature:
            max_total_order: 8
            coefficient_tolerance: 1.0e-14
            max_exponent: 0.999
        refinement:
          tolerance: 1.0e-12
          max_iterations: 150
        verification:
          initial_digits: 80
          max_digits: 300
    cam_postprocessor:
      stochastic_validity:
        probe_epsilon: 1.0e-4
