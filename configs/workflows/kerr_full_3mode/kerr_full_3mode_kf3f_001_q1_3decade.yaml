  input: {from: kerr_full_3mode_kf3f_001_q1_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    band_limited_carrier:
      <<: *mode0_carrier
      readout: 1
      center:
        maximum_neighbor_fraction: 0.45
        spectral_ridge:
          scan_param: omega_c
