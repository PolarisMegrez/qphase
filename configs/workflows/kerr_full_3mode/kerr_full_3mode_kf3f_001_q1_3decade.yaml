- name: kerr_full_3mode_kf3f_001_q1_mode2_carrier
  input: {from: kerr_full_3mode_kf3f_001_q1_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    band_limited_carrier:
