schema: qphase.workflow/2
id: kerr_full_3mode_space_filling_candidate_q0
title: Kerr Full 3Mode Space Filling Candidate Q0
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# Mechanism-deduplicated Q0 stochastic checks for the deterministic S1/S2
# recheck. These short runs test stationarity and line shape; they are not
# intended for formal scaling fits.
- name: kerr_full_3mode_candidate164_q0_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [1.004, 1.0071131176401558, 1.0126491106406734, 1.022493653007614, 1.04]
  engine:
    sde:
      t0: 5000.0
      t1: 25000.0
      dt: 0.005
      n_traj: 8
      seed: 20260808
      ic:
      - ["17.69172769611782+0.0j", "6.0911273523774305-7.383409062965783j", "19.67186591748741+2.0898161364385612j"]
      adaptive: false
      save_stride: 50
      record_modes: [0]
      keep_traj: true
      max_state_norm: 10000.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 4.67630426072065
      omega_c: 1.0
      chi: 1.0e-4
      gamma_a: 0.9637901114446895
      gamma_b: 0.20833426831502472
      gamma_c: 0.8185718144699015
      g_ab: 0.029464248258859665
      g_ac: 4.208110780283891
      g_bc: 0.03624253539123171
  observer:
    first_passage:
      rule: state_norm
      threshold: 100.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 8.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    trajectory_diagnostics: &q0_diagnostics
      modes: [0]
      block_durations: [2000.0, 5000.0]
      coherence: true
      coherence_max_lag: 1000.0
      center_coherence: false
      keep_coherence_per_trajectory: true
      allan: true
      allan_points: 24
      allan_min_windows: 8
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true

- name: kerr_full_3mode_candidate164_q0_fit
  input: {from: kerr_full_3mode_candidate164_q0_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: 4.0
      freq_max: 5.5
      fit_window: 0.08
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

