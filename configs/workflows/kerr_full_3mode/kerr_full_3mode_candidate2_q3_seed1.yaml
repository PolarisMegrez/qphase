schema: qphase.workflow/2
id: kerr_full_3mode_candidate2_q3_seed1
title: Kerr Full 3Mode Candidate2 Q3 Seed1
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
- name: kerr_full_3mode_candidate2_q3_seed1_sim
  engine:
    sde:
      t0: 10000.0
      t1: 70000.0
      dt: 0.005
      n_traj: 16
      seed: 20260810
      ic:
      - ["17.6917276961178+0.0j", "6.09112735237743-7.38340906296578j", "19.6718659174874+2.08981613643856j"]
      adaptive: false
      save_stride: 50
      record_modes: [0]
      keep_traj: true
      max_state_norm: 10000.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 4.67630426072065
      omega_c: 1.0
      chi: 0.0001
      gamma_a: 0.9637901114446895
      gamma_b: 0.20833426831502472
      gamma_c: 0.8185718144699015
      g_ab: 0.029464248258859665
      g_ac: 4.208110780283891
      g_bc: 0.03624253539123171
  observer:
    first_passage:
      rule: state_norm
      threshold: 150.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 6.0
      find_peaks: true
      estimator:
        periodogram: {fft_chunk_trajectories: 2}
    trajectory_diagnostics:
      modes: [0]
      block_durations: [5000.0, 10000.0, 15000.0]
      coherence: true
      coherence_max_lag: 3000.0
      center_coherence: false
      keep_coherence_per_trajectory: true
      allan: true
      allan_points: 32
      allan_min_windows: 8
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [1.008, 1.009462627819949, 1.011192665657358, 1.013239003678587, 1.015659470564676,
            1.01852246772637, 1.021908902300207, 1.025914473551309, 1.030652377295742,
            1.036256504768281, 1.042885226334304, 1.050725866971973, 1.06]
  save: true

- name: kerr_full_3mode_candidate2_q3_seed1_fit
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -5.3
      freq_max: -4.2
      fit_window: 0.08
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]
  input:
    from: kerr_full_3mode_candidate2_q3_seed1_sim
    mode: dataset
  save: true
