schema: qphase.workflow/2
id: kerr_full_3mode_omega_c_formal_diagnostics
title: Kerr Full 3Mode Omega C Formal Diagnostics
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# Full-trajectory diagnostics at four points spanning the pre-registered
# negative-side scaling interval. The broad formal PSD grid remains separate so
# this host-side analyser does not force every scan point to retain three modes.
- name: kerr_full_3mode_omega_c_formal_diagnostics
  save: true

  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [-1.0018, -1.004016597700493, -1.0089628094931142, -1.02]

  engine:
    sde:
      t0: 30000.0
      t1: 130000.0
      dt: 0.005
      n_traj: 16
      seed: 20260811
      ic:
      - ["2.5596906851531513+0.0j", "1.8244433135188922+3.6934242845205207j", "-23.925084375601617+0.7312746798613824j"]
      adaptive: false
      save_stride: 100
      record_modes: [0, 1, 2]
      keep_traj: true
      max_state_norm: 20000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float64
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16

  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: -0.8282592981043274
      omega_c: -1.0
      chi: 0.01
      gamma_a: 3.0
      gamma_b: 1.0
      gamma_c: 0.06381888082869307
      g_ab: 1.0
      g_ac: 0.2
      g_bc: 0.2

  observer:
    first_passage:
      rule: state_norm
      threshold: 100.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2

  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 3.0
      find_peaks: true
      estimator:
        periodogram: {}
    trajectory_diagnostics:
      modes: [0, 1, 2]
      block_durations: [5000.0, 10000.0, 20000.0, 25000.0]
      coherence: true
      coherence_max_lag: 5000.0
      center_coherence: false
      keep_coherence_per_trajectory: true
      allan: true
      allan_points: 32
      allan_min_windows: 8
      amplitude_floor: 1.0e-10
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true
      matrix_projection: true
      matrix_projection_reference: [7.047134845454648, 17.456438119069777, 572.9641877169878,
          4.666075560245737, -61.189330575743234, -40.914681006449854, -9.44664070907121,
          -1.8703077955538046, -89.62429884303049]
      matrix_projection_left_vector: [0.00016446306993940163, 0.0003555951759751354,
          0.011540368993380512, 0.00019454653451317648, -0.002464618231603993,
          -0.0016393387912086341, 0.0003659920294166988, 0.00007453114057933204,
          0.003607936026959142]
      matrix_projection_keep_coordinates: false
