schema: qphase.workflow/2
id: kerr_full_3mode_frequency_q0
title: Kerr Full 3Mode Frequency Q0 Closure Calibration
collection: kerr_full_3mode
tags:
- model:kerr_full_3mode
- purpose:validation/frequency-q0
jobs:
- name: kerr_full_3mode_q0_kf3f_019_omega_c_positive
  save: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values:
        - -1.9996018928294465
        - -1.999
        - -1.9974881135684904
        - -1.993690426555198
        - -1.9841510680753888
  engine:
    sde:
      t0: 10000.0
      t1: 30000.0
      dt: 0.01
      n_traj: 8
      seed: 202609041
      ic:
      - - "99.74288134199509+0.0j"
        - "-74.64725214431756+14.082208368202064j"
        - "-102.68515190449176-10.235171223057074j"
      adaptive: false
      save_stride: 25
      record_modes: [0, 1, 2]
      keep_traj: false
      trajectory_batching: required
      trajectory_batch_size: 4
      rng_group_size: 4
      max_state_norm: 2000.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 1024, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: -4.0
      omega_c: -2.0
      chi: 0.0002
      gamma_a: 0.2313732629253484
      gamma_b: 2.3693276625631956
      gamma_c: 1.5
      g_ab: 3.0
      g_ac: 3.0
      g_bc: 5.0
  observer:
    first_passage:
      rule: state_norm
      threshold: 1000.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0, 1, 2]
      kind: complex
      convention: symmetric
      expected_freq_max: 10.0
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0, 1, 2]
      points: 48
      min_windows: 8
      min_independent_windows: 4
      transfer_chunk_samples: 8192
      device_chunk_trajectories: 4
    coherence_matrix:
      modes: [0, 1, 2]
      time_blocks: 8
      time_chunk_samples: 8192
    moment_statistics:
      modes: [0, 1, 2]
      time_blocks: 8
      time_chunk_samples: 8192

