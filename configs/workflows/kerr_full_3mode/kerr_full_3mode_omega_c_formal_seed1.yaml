schema: qphase.workflow/2
id: kerr_full_3mode_omega_c_formal_seed1
title: Kerr Full 3Mode Omega C Formal Seed1
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# Formal negative-side validation of the retained Kerr-full scaling baseline.
# Fit points are the 13 endpoint-inclusive values listed below. The six marked
# holdouts are geometric midpoints and must not be used to choose the fit window.
- name: kerr_full_3mode_omega_c_formal_seed1_sim
  save: true

  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values:
          # epsilon = abs(omega_c + 1), ordered from the inner endpoint out.
          [-1.0018, -1.0019899663557381, -1.0021999811649833, -1.0026888428479344, -1.0029726148906981,
          -1.003286335345031, -1.004016597700493, -1.0044404968269538, -1.0049091329380002, -1.006,
            -1.0066332211857940, -1.0073332705499447, -1.0089628094931142, -1.0099087163023270,
            -1.0109544511501034, -1.0133886590016434, -1.0148016560898456, -1.0163637764600004,
            -1.02]

  engine:
    sde:
      # The smallest accepted CAM gap is about 3.9e-4. This discards more
      # than eleven corresponding relaxation times before the common record.
      t0: 30000.0
      t1: 130000.0
      dt: 0.005
      n_traj: 32
      seed: 20260809
      ic:
      - ["2.5596906851531513+0.0j", "1.8244433135188922+3.6934242845205207j", "-23.925084375601617+0.7312746798613824j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      max_state_norm: 20000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float64
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16

  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: -0.8282592981043274
      omega_c: -1.0
      chi: 0.01
      gamma_a: 3.0
      gamma_b: 1.0
      gamma_c: 0.06381888082869307
      g_ab: 1.0
      g_ac: 0.2
      g_bc: 0.2

  observer:
    first_passage:
      rule: state_norm
      threshold: 100.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2

  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 3.0
      find_peaks: true
      estimator:
        periodogram: {}

- name: kerr_full_3mode_omega_c_formal_seed1_fit
  input:
    from: kerr_full_3mode_omega_c_formal_seed1_sim
    mode: dataset
  save: true

  engine:
    sde:
      mode: analyze

  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -1.5
      freq_max: -0.5
      fit_window: 0.02
      uncertainty: auto
      clip_by_std: false
      clip_sigma: 10.0
      export: [fit_results.csv, psd_merged.csv]
