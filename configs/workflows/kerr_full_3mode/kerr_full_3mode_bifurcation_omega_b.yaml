schema: qphase.workflow/2
id: kerr_full_3mode_bifurcation_omega_b
title: Kerr Full 3Mode Bifurcation Omega B
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
- name: kerr_full_3mode_bifurcation_omega_b
  save: true

  engine:
    cam: {}

  plugins:
    backend:
      numpy:
        float_dtype: float64
    model:
      kerr_full_3mode:
        omega_a: 0.0
        omega_b: 1.617958768427497
        omega_c: -1.0
        chi: 0.01
        gamma_a: 3.0
        gamma_b: 1.0
        gamma_c: 0.4148645824230304
        g_ab: 1.25
        g_ac: 1.0
        g_bc: 3.0
    cam_solver:
      bifurcation:
        controls:
          omega_b: {min: 1.0, max: 2.2, scale: 1.0, domain: real}
          gamma_c: {min: 0.2, max: 0.7, scale: 0.5, domain: nonnegative}
        perturbation:
          parameter: omega_b
          scale: 1.0
          side: both
        target:
          equilibrium_multiplicity:
            order: 3
        strategy:
          reduced:
            retained_dimension: 1
            order_parameter: r_diag_0
            order_parameter_bounds: [0.0, 200.0]
            max_candidates: 8
            condition_limit: 1.0e11
        discovery:
          seeds:
            samples_per_control: 6
            max_starts: 4096
            order_parameter_samples: 101
        classifier:
          scaling_signature:
            max_total_order: 8
            coefficient_tolerance: 1.0e-14
            max_exponent: 0.999
        refinement:
          tolerance: 1.0e-12
          max_iterations: 150
        verification:
          initial_digits: 80
          max_digits: 300
    cam_postprocessor:
      local_response_validation:
        epsilon_min: 1.0e-10
        epsilon_max: 1.0e-2
        epsilon_points: 25
        precision_digits: 120
        residual_tolerance: 1.0e-45
        fit_points: 6
      stochastic_validity:
        probe_epsilon: 1.0e-4
