schema: qphase.workflow/2
id: kerr_full_3mode_space_filling_s2_q1
title: Kerr Full 3Mode Space Filling S2 Q1
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# S2 case 259/candidate 69: only representative retaining positive W_noise
# after extending deterministic local-response validation to epsilon=0.1.
- name: kerr_full_3mode_space_filling_s2_q1_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [1.003, 1.0042716046149802, 1.0060822019955733, 1.0086602540378444,
            1.0123310603716524, 1.01755780479705, 1.025]
  engine:
    sde:
      t0: 5000.0
      t1: 35000.0
      dt: 0.005
      n_traj: 16
      seed: 20260808
      ic:
      - ["7.022796725033919+0.0j", "4.718439439067953-3.456090875617714j", "9.80133299140441+1.5428011756268645j"]
      adaptive: false
      save_stride: 50
      record_modes: [0]
      keep_traj: true
      max_state_norm: 100.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 1.6133371256757296
      omega_c: 1.0
      chi: 0.001
      gamma_a: 0.32495582663040157
      gamma_b: 0.28554125124913715
      gamma_c: 0.2605806500529943
      g_ab: 0.17413007373617226
      g_ac: 1.136609186440216
      g_bc: 0.016525642834717833
  observer:
    first_passage:
      rule: state_norm
      threshold: 50.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 4.0
      find_peaks: true
      estimator: {periodogram: {}}
    trajectory_diagnostics:
      modes: [0]
      block_durations: [3000.0, 7500.0]
      coherence: true
      coherence_max_lag: 1500.0
      center_coherence: false
      keep_coherence_per_trajectory: true
      allan: true
      allan_points: 24
      allan_min_windows: 8
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true

- name: kerr_full_3mode_space_filling_s2_q1_fit
  input: {from: kerr_full_3mode_space_filling_s2_q1_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -2.3
      freq_max: -1.3
      fit_window: 0.08
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]
