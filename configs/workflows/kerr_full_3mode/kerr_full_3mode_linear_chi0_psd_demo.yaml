schema: qphase.workflow/2
id: kerr_full_3mode_linear_chi0_psd_demo
title: Kerr Full 3Mode Linear (chi=0) PSD Demo (beamer frame 1, option 2)
collection: kerr_full_3mode
tags:
- model:kerr_full_3mode
- purpose:slides/frame1-psd

# Purpose: linear three-mode sensor (Kerr nonlinearity switched off).
# IMPORTANT PHYSICS (verified by eigenanalysis of the drift matrix -iH):
#   * chi is the ONLY nonlinearity of kerr_full_3mode; the gain channel is
#     linear (Lindblad c.dag with rate gamma_c).
#   * At chi=0 the kf3f-004 gain gamma_c=0.9572 is ABOVE the linear
#     stability threshold: slowest drift eigenvalue has Re = +0.089, so
#     trajectories diverge (max_state_norm would trip). The gain must be
#     reduced. Threshold lies between 0.5 and 0.9572; gamma_c=0.5 gives
#     decay rates (-0.78, -0.77, -0.10), i.e. a narrowest line with
#     HWHM ~ 0.10 at mode frequencies {-4.16, -0.51, +4.66} (up to the
#     sign convention of the complex PSD).
#   * With chi=0 the system is a damped linear resonator (noise-driven),
#     NOT a self-oscillator; the "carrier" is a normal-mode resonance.
#
# Integration parameters (vs publication_long31_a5000):
#   t0 50000 -> 1000  (stationarity reached in ~10/0.10 = 100 time units)
#   T  5e5 -> 2e4     (resolution 3.1e-4, ~300x finer than HWHM 0.10)
#   n_traj 512 -> 128 (linear OU: PSD is smooth after modest averaging)
#   dt = 0.01, save_stride = 32 unchanged (Nyquist 9.82 > max mode 4.67)
#
# Scan pair: omega_b = 0.5 vs 0.505 (1% perturbation). Each normal-mode
# peak shifts by (b-mode mixing fraction) x 0.005; the b-like mode near
# -0.51 shifts most. Widen the pair if the shift is not visible.

jobs:
- name: kerr_full_3mode_linear_chi0_psd_demo_sim
  save: true
  system:
    scan_runtime:
      storage_layout: auto
      auto_shard_threshold_mib: 512
      shard_target_mib: 256
      checkpoint: {enabled: true, interval_chunks: 1, keep_on_success: false}
      resources: {gpu_memory_fraction: 0.85}
  scan:
    axes:
      omega_b:
        target: model.kerr_full_3mode.omega_b
        values: [0.5, 0.505]
  engine:
    sde:
      t0: 1000.0
      t1: 21000.0
      dt: 0.01
      n_traj: 128
      seed: 202610182
      ic:
      - - "0.0+0.0j"
        - "0.0+0.0j"
        - "0.0+0.0j"
      adaptive: false
      save_stride: 32
      record_modes: [0, 1, 2]
      keep_traj: false
      trajectory_batching: required
      trajectory_batch_size: 128
      max_state_norm: 600.0
      state_check_interval_steps: 2048
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 2048, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 0.5
      omega_c: -0.5
      chi: 0.0
      gamma_a: 3.0
      gamma_b: 0.7993197086840077
      gamma_c: 0.5
      g_ab: 4.0
      g_ac: 0.1
      g_bc: 2.0
  analyser:
    psd:
      modes: [0, 1, 2]
      kind: complex
      convention: symmetric
      expected_freq_max: 9.0
      estimator: {periodogram: {fft_chunk_trajectories: 16}}
