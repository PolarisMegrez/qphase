schema: qphase.workflow/2
id: kerr_full_3mode_sde_candidate_checks
title: Kerr Full 3Mode Sde Candidate Checks
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
- name: kerr_full_3mode_min_noise_sde_sim
  save: true

  scan:
    axes:
      omega_b:
        target: model.kerr_full_3mode.omega_b
        values: [1.6354208024439685, 1.6394208024439685, 1.6409208024439685, 1.6414208024439685,
            1.6416208024439685, 1.6419208024439684, 1.6422208024439684]

  engine:
    sde:
      t0: 0.0
      t1: 50000.0
      dt: 0.005
      n_traj: 16
      seed: 20260807
      ic:
      - ["4.646296882115494+0.0j", "76.25915818826192+2.780660634786734j", "-100.05699824549055+4.02736581674985j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      max_state_norm: 20000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float64
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16

  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 1.6414208024439685
      omega_c: -1.0
      chi: 0.01
      gamma_a: 3.0
      gamma_b: 1.0
      gamma_c: 0.5864836845489849
      g_ab: 1.0
      g_ac: 1.0
      g_bc: 5.0

  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 6.0
      find_peaks: true
      estimator:
        periodogram: {}

- name: kerr_full_3mode_min_noise_sde_fit
  input:
    from: kerr_full_3mode_min_noise_sde_sim
    mode: dataset
  save: true

  engine:
    sde:
      mode: analyze

  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      freq_min: 4.0
      freq_max: 5.5
      fit_window: 0.03
      uncertainty: auto
      clip_by_std: false
      clip_sigma: 10.0
      export:
      - fit_results.csv
      - psd_merged.csv

- name: kerr_full_3mode_weak_visible_sde_sim
  save: true

  scan:
    axes:
      omega_b:
        target: model.kerr_full_3mode.omega_b
        values: [0.99, 0.995, 0.999, 1.0, 1.001, 1.003, 1.005]

  engine:
    sde:
      t0: 0.0
      t1: 50000.0
      dt: 0.005
      n_traj: 16
      seed: 20260807
      ic:
      - ["14.236381410549924+0.0j", "0.27413783049480145+0.1635490277685447j", "-30.348537602055476+0.002204223481921597j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      max_state_norm: 20000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float64
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16

  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 1.0
      omega_c: -0.4702002015
      chi: 5.702200945e-5
      gamma_a: 9.550294998e-4
      gamma_b: 1.920740028
      gamma_c: 4.212635355e-4
      g_ab: 0.03747310969
      g_ac: 0.2960772923
      g_bc: 0.03724612727

  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 2.0
      find_peaks: true
      estimator:
        periodogram: {}

- name: kerr_full_3mode_weak_visible_sde_fit
  input:
    from: kerr_full_3mode_weak_visible_sde_sim
    mode: dataset
  save: true

  engine:
    sde:
      mode: analyze

  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      freq_min: 0.2
      freq_max: 1.0
      fit_window: 0.03
      uncertainty: auto
      clip_by_std: false
      clip_sigma: 10.0
      export:
      - fit_results.csv
      - psd_merged.csv
