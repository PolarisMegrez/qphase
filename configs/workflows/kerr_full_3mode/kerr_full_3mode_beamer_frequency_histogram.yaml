    cayley_maruyama: {fused: required, chunk_steps: 2048, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 0.5
      omega_c: -0.5
      chi: 0.001
      gamma_a: 3.0
      gamma_b: 0.8
      gamma_c: 1.0
      g_ab: 4.0
      g_ac: 0.1
      g_bc: 2.0
  analyser:
