      min_windows: 4
      transfer_chunk_samples: 32768
      device_chunk_trajectories: 16
      measurement:
        phase_frequency:
          channels: [2]
          min_independent_windows: 2
  input_bindings:
    allan_variance:
      signal: input.trajectories
