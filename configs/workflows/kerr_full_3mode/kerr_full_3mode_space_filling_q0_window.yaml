schema: qphase.workflow/2
id: kerr_full_3mode_space_filling_q0_window
title: Kerr Full 3Mode Space Filling Q0 Window
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# S1 Pareto representative: best W_noise (+0.271), case 103/candidate 27.
- name: kerr_full_3mode_space_filling_q0_window_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values: [0.999, 0.998221720589962, 0.996837722339832, 0.994376586748096, 0.99]
  engine:
    sde:
      t0: 5000.0
      t1: 25000.0
      dt: 0.005
      n_traj: 8
      seed: 20260808
      ic:
      - ["22.91539328848839+0.0j", "7.527306065464295+6.916691589833834j", "-37.866373890712566+1.46601140382903j"]
      adaptive: false
      save_stride: 50
      record_modes: [0]
      keep_traj: true
      max_state_norm: 5000.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 1.215209185994229
      omega_c: 1.0
      chi: 1.0e-4
      gamma_a: 1.192197479699127
      gamma_b: 1.477261120722963
      gamma_c: 0.5422118420819034
      g_ab: 1.9680780156167588
      g_ac: 0.023357178655009744
      g_bc: 1.4243866723285246
  observer:
    first_passage:
      rule: state_norm
      threshold: 230.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 3.0
      find_peaks: true
      estimator: {periodogram: {}}
    trajectory_diagnostics:
      modes: [0]
      block_durations: [2000.0, 5000.0]
      coherence: true
      coherence_max_lag: 1000.0
      center_coherence: false
      keep_coherence_per_trajectory: true
      allan: true
      allan_points: 24
      allan_min_windows: 8
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true

- name: kerr_full_3mode_space_filling_q0_window_fit
  input: {from: kerr_full_3mode_space_filling_q0_window_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.3
      freq_max: 1.7
      fit_window: 0.05
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]
