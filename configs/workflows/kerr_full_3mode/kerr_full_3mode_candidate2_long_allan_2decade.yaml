schema: qphase.workflow/2
id: kerr_full_3mode_candidate2_long_allan_2decade
title: Kerr Full 3Mode Candidate2 Long Allan 2Decade
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# Long candidate-2 validation with Allan statistics and no retained trajectory.
- name: kerr_full_3mode_candidate2_long_allan_2decade_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.kerr_full_3mode.omega_c
        values:
          # epsilon = omega_c - 1. The core Q3 window is sampled more densely.
        - 1.001
        - 1.002
        - 1.004
        - 1.008
        - 1.013239003678587
        - 1.015659470564676
        - 1.018522467726370
        - 1.021908902300207
        - 1.025914473551309
        - 1.030652377295742
        - 1.036256504768281
        - 1.060
        - 1.100
  engine:
    sde:
      t0: 30000.0
      t1: 230000.0
      dt: 0.005
      n_traj: 64
      seed: 20260815
      ic:
      - ["17.6917276961178+0.0j", "6.09112735237743-7.38340906296578j", "19.6718659174874+2.08981613643856j"]
      adaptive: false
      save_stride: 50
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 10000.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    kerr_full_3mode:
      omega_a: 0.0
      omega_b: 4.67630426072065
      omega_c: 1.0
      chi: 0.0001
      gamma_a: 0.9637901114446895
      gamma_b: 0.20833426831502472
      gamma_c: 0.8185718144699015
      g_ab: 0.029464248258859665
      g_ac: 4.208110780283891
      g_bc: 0.03624253539123171
  observer:
    first_passage:
      rule: state_norm
      threshold: 150.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    allan_variance:
      modes: [0]
      points: 40
      min_windows: 8
      min_independent_windows: 4

- name: kerr_full_3mode_candidate2_long_allan_2decade_fit
  input:
    from: kerr_full_3mode_candidate2_long_allan_2decade_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: 1.0
      side: positive
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_independent_windows: 32
      min_scaling_points: 5
      target_scaling_decades: 1.0
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
