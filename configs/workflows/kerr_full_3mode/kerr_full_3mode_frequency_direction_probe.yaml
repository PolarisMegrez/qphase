schema: qphase.workflow/2
id: kerr_full_3mode_frequency_direction_probe
title: Kerr Full 3Mode Frequency Direction Probe
collection: kerr_full_3mode
tags:
- model:kerr_full_3mode
- purpose:search/direction-probe
jobs:
- name: kerr_full_3mode_probe_perturb_omega_c
  save: true
  engine:
    cam: {}
  plugins:
    backend:
      numpy: {float_dtype: float64}
    model:
      kerr_full_3mode:
        omega_a: 0.0
        omega_b: -1.0
        omega_c: 1.0
        chi: 0.001
        gamma_a: 1.0
        gamma_b: 1.0
        gamma_c: 1.0
        g_ab: 1.0
        g_ac: 1.0
        g_bc: 0.2
    cam_solver:
      bifurcation:
        controls:
          omega_b: {min: -6.0, max: 6.0, scale: 1.0, domain: real}
          gamma_c: {min: 0.01, max: 5.0, scale: 1.0, domain: nonnegative, sampling: log}
        perturbation: {parameter: omega_c, scale: 1.0, side: both}
        target:
          equilibrium_multiplicity: {order: 3}
        strategy:
          auto:
            retained_dimension: 1
            max_candidates: 4
            condition_limit: 1.0e11
        discovery:
          seeds:
            samples_per_control: 5
            max_starts: 1024
            order_parameter_samples: 41
        classifier:
          scaling_signature:
            max_total_order: 8
            coefficient_tolerance: 1.0e-14
            max_exponent: 0.999
        refinement: {tolerance: 1.0e-11, max_iterations: 100}
        verification: {initial_digits: 50, max_digits: 150}
  cam_postprocessor:
    local_response_validation:
      epsilon_min: 1.0e-10
      epsilon_max: 1.0e-3
      epsilon_points: 9
      precision_digits: 80
      residual_tolerance: 1.0e-30
      fit_points: 4
    stochastic_validity: {probe_epsilon: 1.0e-3}

- name: kerr_full_3mode_probe_perturb_omega_b
  save: true
  engine:
    cam: {}
  plugins:
    backend:
      numpy: {float_dtype: float64}
    model:
      kerr_full_3mode:
        omega_a: 0.0
        omega_b: -1.0
        omega_c: 1.0
        chi: 0.001
        gamma_a: 1.0
        gamma_b: 1.0
        gamma_c: 1.0
        g_ab: 1.0
        g_ac: 1.0
        g_bc: 0.2
    cam_solver:
      bifurcation:
        controls:
          omega_c: {min: -6.0, max: 6.0, scale: 1.0, domain: real}
          gamma_c: {min: 0.01, max: 5.0, scale: 1.0, domain: nonnegative, sampling: log}
        perturbation: {parameter: omega_b, scale: 1.0, side: both}
        target:
          equilibrium_multiplicity: {order: 3}
        strategy:
          auto:
            retained_dimension: 1
            max_candidates: 4
            condition_limit: 1.0e11
        discovery:
          seeds:
            samples_per_control: 5
            max_starts: 1024
            order_parameter_samples: 41
        classifier:
          scaling_signature:
            max_total_order: 8
            coefficient_tolerance: 1.0e-14
            max_exponent: 0.999
        refinement: {tolerance: 1.0e-11, max_iterations: 100}
        verification: {initial_digits: 50, max_digits: 150}
  cam_postprocessor:
    local_response_validation:
      epsilon_min: 1.0e-10
      epsilon_max: 1.0e-3
      epsilon_points: 9
      precision_digits: 80
      residual_tolerance: 1.0e-30
      fit_points: 4
    stochastic_validity: {probe_epsilon: 1.0e-3}
