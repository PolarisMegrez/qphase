- name: kerr_full_3mode_q1_kf3f_032_allan_mode0
  input: {from: kerr_full_3mode_q1_kf3f_032_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling: &allan_scaling_mode0
      scan_param: omega_b
      critical_value: 2.0
      side: positive
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.25
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 7
      target_scaling_decades: 2.0
      max_scaling_reduced_chi2: 30.0
      bootstrap_samples: 1000
      bootstrap_seed: 202609071
      fit_frequency: false
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}

