schema: qphase.workflow/2
id: kerr_full_3mode_window_extension_cam
title: Kerr Full 3Mode Window Extension Cam
collection: kerr_full_3mode
tags:
- kerr_full_3mode
jobs:
# Deterministic gate for the leading usable-window Kerr-full candidate.
- name: kerr_full_3mode_window_extension_cam
  save: true

  engine:
    cam: {}

  plugins:
    backend:
      numpy:
        float_dtype: float64
    model:
      kerr_full_3mode:
        omega_a: 0.0
        omega_b: -0.8543329239646652
        omega_c: -1.0
        chi: 0.05
        gamma_a: 4.0
        gamma_b: 1.0
        gamma_c: 0.07502418826324707
        g_ab: 1.0
        g_ac: 0.2
        g_bc: 0.2
    cam_solver:
      bifurcation:
        controls:
          omega_b: {min: -0.95, max: -0.75, scale: 0.1, domain: real}
          gamma_c: {min: 0.05, max: 0.1, scale: 0.02, domain: nonnegative}
        perturbation:
          parameter: omega_c
          scale: 1.0
          side: both
        target:
          equilibrium_multiplicity:
            order: 3
        strategy:
          reduced:
            retained_dimension: 1
            order_parameter: r_diag_0
            order_parameter_bounds: [0.0, 20.0]
            max_candidates: 8
            condition_limit: 1.0e11
        discovery:
          seeds:
            samples_per_control: 7
            max_starts: 4096
            order_parameter_samples: 81
        classifier:
          scaling_signature:
            max_total_order: 8
            coefficient_tolerance: 1.0e-14
            max_exponent: 0.999
        refinement:
          tolerance: 1.0e-12
          max_iterations: 180
        verification:
          initial_digits: 80
          max_digits: 300
    cam_postprocessor:
      local_response_validation:
        epsilon_min: 1.0e-6
        epsilon_max: 1.0e1
        epsilon_points: 73
        precision_digits: 100
        residual_tolerance: 1.0e-35
        fit_points: 8
      stochastic_validity:
        probe_epsilon: 0.05
