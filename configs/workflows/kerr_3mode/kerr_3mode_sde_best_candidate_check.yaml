schema: qphase.workflow/2
id: kerr_3mode_sde_best_candidate_check
title: Kerr 3Mode Sde Best Candidate Check
collection: kerr_3mode
tags:
- kerr_3mode
jobs:
- name: kerr_3mode_best_sde_sim
  save: true

  scan:
    axes:
      omega_b:
        target: model.kerr_3mode.omega_b
        values: [-2.1520144940219765, -2.1320144940219765, -2.1250144940219764, -2.1220144940219767,
            -2.1210144940219768, -2.1190144940219766, -2.112014494021977]

  engine:
    sde:
      t0: 0.0
      t1: 1000.0
      dt: 0.005
      n_traj: 16
      seed: 20260807
      ic:
      - ["9.967685329324546+0.0j", "-6.423054405713434-3.1980020138106897j", "-7.885468959233577+2.718921209963483j"]
      adaptive: false
      save_stride: 100
      record_modes: [0]
      keep_traj: false
      max_state_norm: 10000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float64
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16

  model:
    kerr_3mode:
      omega_a: 0.0
      omega_b: -2.1220144940219767
      omega_c: -0.46
      chi: 0.0033
      gamma_a: 1.0
      gamma_b: 1.0
      gamma_c: 1.5274015243870245
      g_ab: 1.0
      g_ac: 3.0

  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 5.0
      find_peaks: true
      estimator:
        periodogram: {}

- name: kerr_3mode_best_sde_fit
  input:
    from: kerr_3mode_best_sde_sim
    mode: dataset
  save: true

  engine:
    sde:
      mode: analyze

  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      freq_min: 0.0
      freq_max: 5.0
      uncertainty: auto
      clip_by_std: true
      clip_sigma: 10.0
      export:
      - fit_results.csv
      - psd_merged.csv
