schema: qphase.workflow/2
id: cpu_smoke_kerr_2mode
title: Cpu Smoke Kerr 2Mode
collection: misc
jobs:
- name: cpu_smoke_kerr_2mode
  save: true

  scan:
    axes:
      omega_b:
        target: model.kerr_2mode.omega_b
        values: [-0.001, -0.01, -0.1]

  engine:
    sde:
      t0: 0.0
      t1: 1.0
      dt: 0.01
      n_traj: 2
      seed: 42
      ic:
      - ["1.0+0.0j", "0.0+0.0j"]

  analyser:
    psd:
      measurement:
        complex_field:
          channels: [0]
          representation: complex
  backend:
    numpy:
      float_dtype: float64

  integrator:
    euler_maruyama: {}

  model:
    kerr_2mode:
      omega_a: 0.0
      omega_b: -0.001
      chi: 0.01
      gamma_a: 0.5
      gamma_b: 1.8728
      g: 0.5

  input_bindings:
    psd:
      signal: input.trajectories
- name: cpu_smoke_kerr_2mode_peaks
  input: {from: cpu_smoke_kerr_2mode, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    peaks:
      scan_param: omega_b
      psd_key: psd
      finder:
        scipy:
          smooth_window: 5
          distance: 5
          noise_threshold:
          prominence:
