schema: qphase.workflow/2
id: cpu_smoke_clk3_allan_scaling
title: CPU smoke collective-loss Kerr trimer Allan-scaling analyze chain
collection: misc
tags:
- model:collective_loss_kerr_3mode
- purpose:smoke

jobs:
- name: cpu_smoke_clk3_allan_scaling_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - 1.1067468284070492
        - 1.1167468284070492
        - 1.1367468284070492
        - 1.1767468284070492
  engine:
    sde:
      t0: 100.0
      t1: 2100.0
      dt: 0.05
      n_traj: 32
      seed: 20260901
      ic:
      - - "32.5964406+0.0j"
        - "7.82417847-3.70743770j"
        - "-14.27722901-2.01412483j"
      adaptive: false
      save_stride: 20
      record_modes: [0]
      keep_traj: false
  backend:
    numpy: {float_dtype: float64}
  integrator:
    euler_maruyama: {}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: -0.01808028668165207
      omega_c: 1.0967468284070492
      chi: 3.548688561976006e-05
      g_ab: 0.006479437632129051
      g_ac: 0.6035382548114513
      g_bc: 0.0021544100365580555
      pump_a: 0.07598771590146015
      kappa_bright: 1.0
      kappa_dark: 0.1775148709287836
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 1.0
      find_peaks: false
    allan_variance:
      modes: [0]
      points: 40
      min_windows: 4
      min_independent_windows: 4

- name: cpu_smoke_clk3_allan_scaling_carrier
  input:
    from: cpu_smoke_clk3_allan_scaling_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    band_limited_carrier:
      scan_param: omega_c
      readout: 0
      freq_min: -0.5
      freq_max: 0.2
      maximum_lag: 256.0
      tracking_enabled: true

- name: cpu_smoke_clk3_allan_scaling_allan
  input:
    from: cpu_smoke_clk3_allan_scaling_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: 1.0967468284070492
      side: positive
      mode: 0
      min_local_r2: 0.9
      min_tau_decades: 0.0
      min_averaging_samples: 4
      max_relative_sem: 1.0
      min_independent_windows: 4
      min_scaling_points: 3
      target_scaling_decades: 0.5
      max_scaling_reduced_chi2: 1000000.0
      bootstrap_samples: 0
      fit_frequency: true
