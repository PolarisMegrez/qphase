schema: qphase.workflow/2
id: kerr_2mode_cayley
title: Kerr 2Mode Cayley
collection: kerr_2mode
tags:
- model:kerr_2mode
jobs:
- name: kerr_2mode_cayley_sim
  save: true

  scan:
    axes:
      omega_b:
        target: model.kerr_2mode.omega_b
        logspace: {start: -4, stop: -2, num: 21}

  engine:
    sde:
      t0: 0.0
      t1: 1000.0
      dt: 0.001
      n_traj: 200
      seed: 42
      ic:
      - ["7.0+0.0j", "7.0+0.0j"]
      adaptive: false
      save_stride: 10
      record_modes: [0]
      keep_traj: false
      # The dispersive Kerr gain-loss model has a finite attraction basin.
      # Reject escaped trajectories before downsampling can alias them near zero.
      max_state_norm: 1000.0
      state_check_interval_steps: 1024

  backend:
    cupy:
      float_dtype: float32
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 128
      max_modes: 16

  model:
    kerr_2mode:
      omega_a: 0.0
      omega_b: 0.0
      chi: 0.0001
      gamma_a: 1.0
      gamma_b: 1.03829
      g: 0.8

  analyser:
    psd:
      modes: [0]
      kind: complex
      expected_freq_max: 1.0
      find_peaks: true


- name: kerr_2mode_cayley_fit
  input:
    from: kerr_2mode_cayley_sim
    mode: dataset
  save: true
  engine:
    sde:
      mode: analyze
  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      uncertainty: auto
      clip_by_std: true
      clip_sigma: 10.0
      export:
      - fit_results.csv
      - psd_merged.csv
