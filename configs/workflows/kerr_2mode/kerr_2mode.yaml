schema: qphase.workflow/2
id: kerr_2mode
title: Kerr 2Mode
collection: kerr_2mode
tags:
- model:kerr_2mode
jobs:
- name: kerr_2mode
  save: true

  scan:
    axes:
      omega_b:
        target: model.kerr_2mode.omega_b
        values: [-0.001, -0.01, -0.1]

  engine:
    sde:
      t0: 0.0
      t1: 5000.0
      dt: 0.05
      n_traj: 500
      seed: 42
      ic:
      - ["1.0+0.0j", "1.0+0.0j"]
      adaptive: false
      save_stride: 2

  backend:
    cupy:
      float_dtype: float32
      device: cuda

  integrator:
    euler_maruyama: {}

  model:
    kerr_2mode:
      omega_a: 0.0
      omega_b: -0.001
      chi: 0.01
      gamma_a: 0.5
      gamma_b: 1.8728
      g: 0.5

  analyser:
    psd:
      measurement:
        complex_field:
          channels: [0]
          representation: complex
  input_bindings:
    psd:
      signal: input.trajectories
- name: kerr_2mode_peaks
  input: {from: kerr_2mode, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    peaks:
      scan_param: omega_b
      psd_key: psd
      finder:
        scipy:
          smooth_window: 5
          distance: 5
          noise_threshold:
          prominence:
