      dt: 0.05
      n_traj: 200
      seed: 42
      ic:
      - ["8.7454119854+0.0j", "-1.1050612448-4.1186291634j"]
      adaptive: false
      save_stride: 80
      record_modes: [0]
      keep_traj: false
      max_state_norm: 1000.0
      state_check_interval_steps: 2048
  backend:
    cupy:
      float_dtype: float64
      device: cuda
  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 256
      max_modes: 16
  model:
