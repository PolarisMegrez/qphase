- name: pair_hopping_2mode_cayley_plus_fit
  input:
    from: pair_hopping_2mode_cayley_plus_sim
    mode: dataset
  save: true
  engine:
    sde:
      mode: analyze
  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      freq_min: -0.23
      freq_max: -0.1
      uncertainty: auto
      clip_by_std: true
      clip_sigma: 10.0
      export:
      - fit_results.csv
      - psd_merged.csv
