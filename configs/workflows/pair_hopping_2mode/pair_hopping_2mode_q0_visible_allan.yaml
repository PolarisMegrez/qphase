schema: qphase.workflow/2
id: pair_hopping_2mode_q0_visible_allan
title: Pair Hopping 2Mode Q0 Visible Allan
collection: pair_hopping_2mode
tags:
- pair_hopping_2mode
jobs:
- name: pair_hopping_2mode_q0_visible_sim
  save: true
  scan:
    axes:
      omega_b:
        target: model.pair_hopping_2mode.omega_b
        values:
        - 1.4238091481090664
        - 1.4488091481090666
        - 1.4578091481090665
        - 1.4613091481090663
        - 1.4628091481090666
  engine:
    sde:
      t0: 5000.0
      t1: 55000.0
      dt: 0.02
      n_traj: 8
      seed: 20260809
      ic:
      - ["1.1646593557032523+0.0j", "-0.2658971292877328-0.07260168276406496j"]
      adaptive: false
      save_stride: 10
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 30.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    pair_hopping_2mode:
      omega_a: 0.0
      omega_b: 1.4638091481090665
      g: 1.0
      k: 0.5712971350999257
      gamma_a: 0.026629366234207415
      gamma_b: 0.374079474291042
  observer:
    first_passage:
      rule: state_norm
      threshold: 20.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 5.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 36
      min_windows: 8
      min_independent_windows: 4
    trajectory_diagnostics:
      modes: [0]
      block_durations: [1000.0, 5000.0]
      coherence: true
      coherence_max_lag: 1000.0
      center_coherence: false
      keep_coherence_per_trajectory: false
      allan: false
      block_spectrum: true
      block_spectrum_wing_factor: 3.0
      stationarity_details: true

- name: pair_hopping_2mode_q0_visible_lorentz
  input: {from: pair_hopping_2mode_q0_visible_sim, mode: dataset}
  save: true
  engine: {sde: {mode: analyze}}
  analyser:
    lorentz_fitter:
      scan_param: omega_b
      mode: 0
      freq_min: -0.8
      freq_max: 0.3
      fit_window: 0.25
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: pair_hopping_2mode_q0_visible_allan_negative
  input: {from: pair_hopping_2mode_q0_visible_sim, mode: dataset}
  save: true
  engine: {sde: {mode: analyze}}
  analyser:
    allan_scaling:
      scan_param: omega_b
      critical_value: 1.4638091481090665
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.25
      white_slope_max: -0.75
      min_local_r2: 0.8
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 0.5
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260809
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
