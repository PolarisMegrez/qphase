schema: qphase.workflow/2
id: vdp_2mode_bifurcation_order4
title: Vdp 2Mode Bifurcation Order4
collection: vdp_2mode
tags:
- vdp_2mode
jobs:
- name: vdp_2mode_bifurcation_order4
  save: true

  scan:
    combine: cartesian
    axes:
      Gamma:
        target: model.vdp_2mode.Gamma
        values: [0.01, 0.001, 0.0001]

  engine:
    cam: {}

  plugins:
    backend:
      numpy:
        float_dtype: float64
    model:
      vdp_2mode:
        omega_a: 0.0
        omega_b: 0.0
        gamma_a: 1.0
        gamma_b: 1.0
        Gamma: 0.001
        g: 1.0
    cam_solver:
      bifurcation:
        controls:
          omega_a: {min: -2.0, max: 2.0, scale: 1.0, domain: real}
          gamma_b: {min: 0.01, max: 5.0, scale: 1.0, domain: nonnegative}
          g: {min: 0.01, max: 5.0, scale: 1.0, domain: nonnegative}
        perturbation:
          parameter: omega_a
          scale: 1.0
          side: both
        target:
          equilibrium_multiplicity:
            order: 4
        strategy:
          auto:
            retained_dimension: 1
            max_candidates: 8
            condition_limit: 1.0e11
        discovery:
          seeds:
            samples_per_control: 9
            max_starts: 4096
            order_parameter_samples: 101
        classifier:
          scaling_signature:
            max_total_order: 8
            coefficient_tolerance: 1.0e-14
            max_exponent: 0.999
        refinement:
          tolerance: 1.0e-11
          max_iterations: 100
        verification:
          initial_digits: 50
          max_digits: 200
    cam_postprocessor:
      local_response_validation:
        epsilon_min: 1.0e-12
        epsilon_max: 1.0e-4
        epsilon_points: 9
        precision_digits: 100
        residual_tolerance: 1.0e-40
        fit_points: 4
      stochastic_validity:
        probe_epsilon: 1.0e-4
