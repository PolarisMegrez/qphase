schema: qphase.workflow/2
id: collective_loss_kerr_3mode_refined_dark_signed_figure1
title: Collective Loss Kerr 3Mode Refined Dark Signed Figure 1
collection: collective_loss_kerr_3mode
tags:
- model:collective_loss_kerr_3mode
- candidate:refined-dark
- task:signed-window
- purpose:paper
jobs:
- name: collective_loss_kerr_3mode_refined_dark_signed_figure1_sim
  save: true
  system:
    scan_runtime:
      checkpoint: {enabled: true, interval_chunks: 1, keep_on_success: false}
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - 1.0965468284070492  # epsilon=-2e-4
        - 1.0965668284070491  # epsilon=-1.8e-4
        - 1.0965868284070492  # epsilon=-1.6e-4
        - 1.0966068284070492  # epsilon=-1.4e-4
        - 1.0966268284070493  # epsilon=-1.2e-4
        - 1.0966468284070492  # epsilon=-1e-4
        - 1.0966668284070491  # epsilon=-8e-5
        - 1.0966868284070492  # epsilon=-6e-5
        - 1.0967068284070491  # epsilon=-4e-5
        - 1.0967268284070493  # epsilon=-2e-5
        - 1.0967668284070491  # epsilon=+2e-5
        - 1.0967868284070492  # epsilon=+4e-5
        - 1.0968068284070491  # epsilon=+6e-5
        - 1.0968268284070493  # epsilon=+8e-5
        - 1.0968468284070492  # epsilon=+1e-4
        - 1.0968668284070491  # epsilon=+1.2e-4
        - 1.0968868284070492  # epsilon=+1.4e-4
        - 1.0969068284070491  # epsilon=+1.6e-4
        - 1.0969268284070492  # epsilon=+1.8e-4
        - 1.0969468284070492  # epsilon=+2e-4
  engine:
    sde:
      t0: 300000.0
      t1: 1500000.0
      dt: 0.04
      n_traj: 64
      trajectory_batch_size: 32
      seed: 20260820
      ic:
      - - "32.5964406+0.0j"
        - "7.82417847-3.70743770j"
        - "-14.27722901-2.01412483j"
      adaptive: false
      save_stride: 20
      record_modes: [0, 1, 2]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 220.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: -0.01808028668165207
      omega_c: 1.0967468284070492
      chi: 3.548688561976006e-05
      g_ab: 0.006479437632129051
      g_ac: 0.6035382548114513
      g_bc: 0.0021544100365580555
      pump_a: 0.07598771590146015
      kappa_bright: 1.0
      kappa_dark: 0.1775148709287836
  observer:
    first_passage:
      rule: state_norm
      threshold: 150.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0, 1, 2]
      kind: complex
      convention: symmetric
      expected_freq_max: 1.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 64
      min_windows: 8
      min_independent_windows: 2
      transfer_chunk_samples: 8192
    coherence_carrier:
      modes: [0, 1, 2]
      include_trace: true
      polynomial_order: 2
      minimum_lag_points: 4
      maximum_lag_points: 12
      time_chunk_samples: 8192
    coherence_matrix:
      modes: [0, 1, 2]
      time_blocks: 16
      time_chunk_samples: 8192
    moment_statistics:
      modes: [0, 1, 2]
      time_blocks: 16
      time_chunk_samples: 8192

- name: collective_loss_kerr_3mode_refined_dark_signed_figure1_fit
  input:
    from: collective_loss_kerr_3mode_refined_dark_signed_figure1_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.3
      freq_max: -0.1
      fit_window: 0.08
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv]
