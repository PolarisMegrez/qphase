schema: qphase.workflow/2
id: collective_loss_kerr_3mode_dark_manifold_refinement
title: Collective Loss Kerr 3Mode Dark Manifold Refinement
collection: collective_loss_kerr_3mode
tags:
- collective_loss_kerr_3mode
jobs:
# Second-stage local refinement on the two favorable directions identified by
# collective_loss_kerr_3mode_dark_manifold_oat_refinement. The bifurcation
# solver re-solves g_ac and kappa_dark at every Cartesian point.
- name: collective_loss_kerr_3mode_dark_manifold_refinement
  save: true
  system:
    scan_runtime:
      checkpoint:
        enabled: true
        interval_chunks: 1
        keep_on_success: false
  scan:
    combine: cartesian
    axes:
      g_ab:
        target: model.collective_loss_kerr_3mode.g_ab
        values:
        - 0.006479437632129051
        - 0.009719156448193577
        - 0.012958875264258101
        - 0.0161985940803226
        - 0.02159812544043017
      pump_a:
        target: model.collective_loss_kerr_3mode.pump_a
        values:
        - 0.06607627469692187
        - 0.06938008843176798
        - 0.0726839021666141
        - 0.07598771590146015
  engine:
    cam:
      case_failure_policy: record
  plugins:
    backend:
      numpy:
        float_dtype: float64
    model:
      collective_loss_kerr_3mode:
        omega_a: 0.0
        omega_b: -0.01808028668165207
        omega_c: 1.0967468284070492
        chi: 3.548688561976006e-05
        g_ab: 0.02159812544043017
        g_ac: 0.5127408501488523
        g_bc: 0.0021544100365580555
        pump_a: 0.06607627469692187
        kappa_bright: 1.0
        kappa_dark: 0.2047542136164718
    cam_solver:
      bifurcation:
        controls:
          g_ac:
            min: 0.2
            max: 1.2
            scale: 0.5
            domain: nonnegative
            sampling: log
          kappa_dark:
            min: 0.05
            max: 0.6
            scale: 0.2
            domain: nonnegative
            sampling: log
        perturbation:
          parameter: omega_c
          scale: 1.0
          side: positive
        target:
          equilibrium_multiplicity:
            order: 3
        strategy:
          reduced:
            retained_dimension: 1
            max_candidates: 8
            condition_limit: 1.0e11
        discovery:
          seeds:
            samples_per_control: 4
            max_starts: 1024
            order_parameter_samples: 41
        classifier:
          scaling_signature:
            max_total_order: 8
            coefficient_tolerance: 1.0e-14
            max_exponent: 0.999
        refinement:
          tolerance: 1.0e-11
          max_iterations: 120
        verification:
          initial_digits: 60
          max_digits: 240
        audit:
          near_miss_per_reason: 8
          near_miss_total: 64
    cam_postprocessor:
      local_response_validation:
        epsilon_min: 1.0e-10
        epsilon_max: 0.1
        epsilon_points: 19
        fit_points: 7
        precision_digits: 80
        residual_tolerance: 1.0e-30
      stochastic_validity:
        probe_epsilon: 0.0001
