schema: qphase.workflow/2
id: collective_loss_kerr_3mode_control_completion_q0
title: Collective Loss Kerr 3Mode Control Completion Q0
collection: collective_loss_kerr_3mode
tags:
- collective_loss_kerr_3mode
jobs:
# Q0 closure for four Pareto representatives found by the 21-chart audit.
- name: collective_loss_kerr_3mode_completion_detuning_passive_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values: [1.9093339678794146, 1.9133339678794146, 1.9213339678794146, 1.9453339678794146,
            2.0053339678794146]
  engine:
    sde:
      t0: 50000.0
      t1: 100000.0
      dt: 0.01
      n_traj: 8
      seed: 20260813
      ic:
      - ["12.7461269054143+0.0j", "8.27211565771289-0.216530956007449j", "-11.0544314716452-0.159927944230072j"]
      adaptive: false
      save_stride: 20
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 180.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: 1.0502915249663638
      omega_c: 1.9053339678794146
      chi: 0.0012882118577521074
      g_ab: 0.01015821206656011
      g_ac: 1.4736377244920567
      g_bc: 1.4282439936339582
      pump_a: 0.037171253900995266
      kappa_bright: 1.0
      kappa_dark: 0.011322485744608207
  observer:
    first_passage: &first_passage
      rule: state_norm
      threshold: 120.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd: &psd
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 6.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance: &allan_variance
      modes: [0]
      points: 40
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_completion_detuning_passive_fit
  input: {from: collective_loss_kerr_3mode_completion_detuning_passive_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: 0.2
      freq_max: 1.2
      fit_window: 0.2
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_completion_detuning_passive_allan
  input: {from: collective_loss_kerr_3mode_completion_detuning_passive_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling: &allan_positive
      scan_param: omega_c
      critical_value: 1.9053339678794146
      side: positive
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 1.3
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260813
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}

