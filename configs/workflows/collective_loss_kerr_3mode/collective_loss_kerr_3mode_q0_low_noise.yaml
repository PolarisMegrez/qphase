schema: qphase.workflow/2
id: collective_loss_kerr_3mode_q0_low_noise
title: Collective Loss Kerr 3Mode Q0 Low Noise
collection: collective_loss_kerr_3mode
tags:
- collective_loss_kerr_3mode
jobs:
# Q0 closure for the strongest low-projected-noise branch from the
# detuning/mixing control scheme.
- name: collective_loss_kerr_3mode_q0_low_noise_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - 4.025676863491535
        - 4.033459658492398
        - 4.047299640093219
        - 4.071910425249885
        - 4.105676863491535
  engine:
    sde:
      t0: 150000.0
      t1: 175000.0
      dt: 0.01
      n_traj: 8
      seed: 20260809
      ic:
      - - "23.5303852415116+0.0j"
        - "1.19657611141537-0.219682109078733j"
        - "-2.32541536227697-0.103488142726846j"
      adaptive: false
      save_stride: 10
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 180.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: 0.3520603175574583
      omega_c: 4.015676863491535
      chi: 3.617359901025647e-05
      g_ab: 0.007957351542249812
      g_ac: 0.38847521037712585
      g_bc: 0.22330128556092804
      pump_a: 0.0035592310576938514
      kappa_bright: 1.0
      kappa_dark: 0.20693127064576736
  observer:
    first_passage:
      rule: state_norm
      threshold: 120.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 6.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 40
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_q0_low_noise_fit
  input: {from: collective_loss_kerr_3mode_q0_low_noise_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.5
      freq_max: 0.2
      fit_window: 0.12
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_q0_low_noise_allan
  input: {from: collective_loss_kerr_3mode_q0_low_noise_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: 4.015676863491535
      side: positive
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 0.9
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260809
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
