schema: qphase.workflow/2
id: collective_loss_kerr_3mode_interference_q0_pareto
title: Collective Loss Kerr 3Mode Interference Q0 Pareto
collection: collective_loss_kerr_3mode
tags:
- collective_loss_kerr_3mode
jobs:
# Balanced high-gap fallbacks after the widest-window Q0 candidates failed
# line-shape or escape checks.
- name: collective_loss_kerr_3mode_interference_acn_bcp_pareto_q0_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - -3.3162604822963475
        - -3.3212604822963474
        - -3.3362604822963475
        - -3.3612604822963474
        - -3.4112604822963477
  engine:
    sde:
      t0: 50000.0
      t1: 200000.0
      dt: 0.04
      n_traj: 8
      seed: 20260821
      ic:
      - - "14.26383257122161+0.0j"
        - "-0.7641268179765037-0.1587800813274869j"
        - "-1.035688386192088+0.1292805851976997j"
      adaptive: false
      save_stride: 20
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 100.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: 3.0025637939271164
      omega_c: -3.3112604822963476
      chi: 0.00038743488076952755
      g_ab: 0.15252894244185203
      g_ac: -0.2519741331639632
      g_bc: 0.001747545725421839
      pump_a: 0.007924395146795273
      kappa_bright: 1.0
      kappa_dark: 0.000374177611849409
  observer:
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 1.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 40
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_interference_acn_bcp_pareto_q0_fit
  input: {from: collective_loss_kerr_3mode_interference_acn_bcp_pareto_q0_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: 0.1
      freq_max: 0.8
      fit_window: 0.18
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_interference_acn_bcp_pareto_q0_allan
  input: {from: collective_loss_kerr_3mode_interference_acn_bcp_pareto_q0_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: -3.3112604822963476
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 0.7
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260821
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}

