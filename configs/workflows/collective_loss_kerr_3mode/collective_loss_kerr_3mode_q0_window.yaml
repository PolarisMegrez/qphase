schema: qphase.workflow/2
id: collective_loss_kerr_3mode_q0_window
title: Collective Loss Kerr 3Mode Q0 Window
collection: collective_loss_kerr_3mode
tags:
- collective_loss_kerr_3mode
jobs:
# Q0 closure for the widest deterministic window found in the
# passive-coupling/gain control scheme. This is a sign and stationarity check,
# not a formal exponent run.
- name: collective_loss_kerr_3mode_q0_window_sim
  save: true
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - 1.3993875233083963
        - 1.3916047283075337
        - 1.3777647467067125
        - 1.3531539619287465
        - 1.3293875233083963
  engine:
    sde:
      t0: 100000.0
      t1: 125000.0
      dt: 0.01
      n_traj: 8
      seed: 20260809
      ic:
      - - "10.7871768966572+0.0j"
        - "-1.63536601779665-0.0171406718263646j"
        - "0.231066340931919-0.244850702373723j"
      adaptive: false
      save_stride: 10
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 100.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: 0.49267398193478584
      omega_c: 1.4093875233083963
      chi: 0.00032751545277039763
      g_ab: 0.03945301370985157
      g_ac: 0.19044417444789127
      g_bc: 1.4048306187036779
      pump_a: 0.00869596350447972
      kappa_bright: 1.0
      kappa_dark: 1.9214672688991023e-05
  observer:
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0]
      kind: complex
      convention: symmetric
      expected_freq_max: 5.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 36
      min_windows: 8
      min_independent_windows: 4

- name: collective_loss_kerr_3mode_q0_window_fit
  input: {from: collective_loss_kerr_3mode_q0_window_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.2
      freq_max: 0.5
      fit_window: 0.12
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv, psd_merged.csv]

- name: collective_loss_kerr_3mode_q0_window_allan
  input: {from: collective_loss_kerr_3mode_q0_window_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      scan_param: omega_c
      critical_value: 1.4093875233083963
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 0.7
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260809
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}
