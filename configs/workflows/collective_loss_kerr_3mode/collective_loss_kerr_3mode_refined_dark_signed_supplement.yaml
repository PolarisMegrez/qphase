schema: qphase.workflow/2
id: collective_loss_kerr_3mode_refined_dark_signed_supplement
title: Collective Loss Kerr 3Mode Refined Dark Signed Supplement
collection: collective_loss_kerr_3mode
tags:
- collective_loss_kerr_3mode
- refined_dark
- signed_window
- quadratic_moments
- supplement
jobs:
- name: collective_loss_kerr_3mode_refined_dark_signed_supplement_sim
  save: true
  system:
    scan_runtime:
      checkpoint: {enabled: true, interval_chunks: 1, keep_on_success: false}
  scan:
    axes:
      omega_c:
        target: model.collective_loss_kerr_3mode.omega_c
        values:
        - 1.0965648284070493  # epsilon=-1.82e-4
        - 1.0966008284070492  # epsilon=-1.46e-4
        - 1.0966368284070491  # epsilon=-1.10e-4
        - 1.0966728284070493  # epsilon=-7.40e-5
        - 1.0967088284070492  # epsilon=-3.80e-5
        - 1.0967848284070492  # epsilon=+3.80e-5
        - 1.0968208284070491  # epsilon=+7.40e-5
        - 1.0968568284070492  # epsilon=+1.10e-4
        - 1.0968928284070492  # epsilon=+1.46e-4
        - 1.0969288284070491  # epsilon=+1.82e-4
  engine:
    sde:
      t0: 300000.0
      t1: 1200000.0
      dt: 0.04
      n_traj: 128
      trajectory_batch_size: 48
      seed: 20260821
      ic:
      - - "32.5964406+0.0j"
        - "7.82417847-3.70743770j"
        - "-14.27722901-2.01412483j"
      adaptive: false
      save_stride: 20
      record_modes: [0, 1, 2]
      keep_traj: false
      trajectory_batching: required
      max_state_norm: 220.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_loss_kerr_3mode:
      omega_a: 0.0
      omega_b: -0.01808028668165207
      omega_c: 1.0967468284070492
      chi: 3.548688561976006e-05
      g_ab: 0.006479437632129051
      g_ac: 0.6035382548114513
      g_bc: 0.0021544100365580555
      pump_a: 0.07598771590146015
      kappa_bright: 1.0
      kappa_dark: 0.1775148709287836
  observer:
    first_passage:
      rule: state_norm
      threshold: 150.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    psd:
      modes: [0, 1, 2]
      kind: complex
      convention: symmetric
      expected_freq_max: 1.0
      find_peaks: true
      estimator: {periodogram: {fft_chunk_trajectories: 2}}
    allan_variance:
      modes: [0]
      points: 64
      min_windows: 8
      min_independent_windows: 2
      transfer_chunk_samples: 8192
    coherence_carrier:
      modes: [0, 1, 2]
      include_trace: true
      polynomial_order: 2
      minimum_lag_points: 4
      maximum_lag_points: 12
      time_chunk_samples: 8192
    coherence_matrix:
      modes: [0, 1, 2]
      time_blocks: 16
      time_chunk_samples: 8192
    moment_statistics:
      modes: [0, 1, 2]
      time_blocks: 16
      time_chunk_samples: 8192
    quadratic_moments:
      modes: [0, 1, 2]
      max_order: 4
      time_blocks: 16
      time_chunk_samples: 8192
      observables:
        critical_soft_coordinate:
          matrix:
          - ["0.7444027234051913+0j", "0.17867662270195317-0.08466778695849189j", "-0.32603828037449767-0.04599668630869436j"]
          - ["0.17867662270195317+0.08466778695849189j", "0.05252465605462568+0j", "-0.07303334287900022-0.04811913966592864j"]
          - ["-0.32603828037449767+0.04599668630869436j", "-0.07303334287900022+0.04811913966592864j", "0.14566826732834895+0j"]
          reference_matrix:
          - ["1062.6387137633292+0j", "254.94178386143267+120.80683144993054j", "-465.20232780782095+65.62961109251518j"]
          - ["254.94178386143267-120.80683144993054j", "75.44393675445318+0j", "-104.20641734422274+68.65799856074392j"]
          - ["-465.20232780782095-65.62961109251518j", "-104.20641734422274-68.65799856074392j", "208.34435794178174+0j"]

- name: collective_loss_kerr_3mode_refined_dark_signed_supplement_fit
  input:
    from: collective_loss_kerr_3mode_refined_dark_signed_supplement_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    lorentz_fitter:
      scan_param: omega_c
      mode: 0
      freq_min: -0.3
      freq_max: -0.1
      fit_window: 0.08
      uncertainty: auto
      clip_by_std: false
      export: [fit_results.csv]

- name: collective_loss_kerr_3mode_refined_dark_signed_supplement_carrier
  input:
    from: collective_loss_kerr_3mode_refined_dark_signed_supplement_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    band_limited_carrier:
      scan_param: omega_c
      readout: trace
      freq_min: -0.3
      freq_max: -0.1
      maximum_lag: 256.0
      tracking_enabled: true
      export:
      - carrier_results.csv
      - carrier_candidates.csv
      - carrier_platforms.csv

- name: collective_loss_kerr_3mode_refined_dark_signed_supplement_finite_delay
  input:
    from: collective_loss_kerr_3mode_refined_dark_signed_supplement_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    finite_delay_carrier:
      scan_param: omega_c
      readouts: [0, 1, 2, trace]
      detector_rates: [0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0]
      maximum_lag: 4096.0

- name: collective_loss_kerr_3mode_refined_dark_signed_supplement_ridge
  input:
    from: collective_loss_kerr_3mode_refined_dark_signed_supplement_sim
    mode: dataset
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    spectral_ridge:
      scan_param: omega_c
      readouts: [0, 1, 2, trace]
      freq_min: -0.3
      freq_max: -0.1
      minimum_prominence_fraction: 0.03
      tracking_gap_factor: 1.5
      tracking_path_count: 2
      tracking_max_cost_delta: 2.0
