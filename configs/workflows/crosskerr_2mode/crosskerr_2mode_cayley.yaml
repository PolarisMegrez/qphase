schema: qphase.workflow/2
id: crosskerr_2mode_cayley
title: Crosskerr 2Mode Cayley
collection: crosskerr_2mode
tags:
- crosskerr_2mode
jobs:
- name: crosskerr_2mode_cayley_sim
  save: true

  scan:
    axes:
      gamma_b:
        target: model.crosskerr_2mode.gamma_b
        values: [0.501165914, 0.501359356, 0.501584893, 0.50184785, 0.502154435, 0.502511886,
            0.502928645, 0.503414549, 0.503981072, 0.504641589, 0.505411695, 0.506309573,
            0.507356423, 0.508576959, 0.51, 0.51165914, 0.51359356, 0.51584893, 0.5184785,
            0.52154435, 0.52511886, 0.52928645, 0.53414549, 0.53981072, 0.54641589, 0.55411695,
            0.56309573, 0.57356423, 0.58576959, 0.6]

  engine:
    sde:
      t0: 0.0
      t1: 50000.0
      dt: 0.5
      n_traj: 100
      seed: 42
      ic:
      - ["700.0+0.0j", "0.0+700.0j"]
      adaptive: false
      save_stride: 1
      record_modes: [0]
      keep_traj: false

  backend:
    cupy:
      float_dtype: float32
      device: cuda

  integrator:
    cayley_maruyama:
      fused: required
      chunk_steps: 128
      max_modes: 16

  model:
    crosskerr_2mode:
      omega_a: 0.5
      omega_b: 0.5
      chi: 0.01
      gamma_a: 0.5
      gamma_b: 0.5
      g: 0.5

  analyser:
    psd:
      modes: [0]
      kind: complex
      find_peaks: true

- name: crosskerr_2mode_cayley_fit
  input:
    from: crosskerr_2mode_cayley_sim
    mode: dataset
  save: true
  engine:
    sde:
      mode: analyze
  analyser:
    lorentz_fitter:
      scan_param: gamma_b
      mode: 0
      uncertainty: auto
      clip_by_std: true
      clip_sigma: 10.0
      export:
      - fit_results.csv
      - psd_merged.csv
