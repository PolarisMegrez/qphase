schema: qphase.workflow/2
id: collective_kerr_2mode_nonlinear_pump_s0
title: Collective Kerr 2Mode Nonlinear Pump S0
collection: collective_kerr_2mode
tags:
- collective_kerr_2mode
jobs:
- name: collective_kerr_2mode_nonlinear_pump_s0
  save: true
  system:
    scan_runtime:
      checkpoint:
        enabled: true
        interval_chunks: 1
        keep_on_success: false
  scan:
    combine: zipped
    axes:
      delta:
        target: model.collective_kerr_2mode.delta
        values:
        - 1.3103024778291628
        - 0.15941821570430645
        - 0.050125860625305774
        - 4.165385997766876
      g:
        target: model.collective_kerr_2mode.g
        values:
        - 1.2970776820891416
        - 0.02138651902790912
        - 0.4498406259214611
        - 0.06319170656386769
      kappa_dark:
        target: model.collective_kerr_2mode.kappa_dark
        values:
        - 0.00015874427894421012
        - 0.2718318394898487
        - 0.0012926218294014706
        - 0.01765658179913496
  engine:
    cam:
      case_failure_policy: record
  plugins:
    backend:
      numpy:
        float_dtype: float64
    model:
      collective_kerr_2mode:
        omega_0: 0.0
        delta: 1.0
        chi: 0.001
        g: 0.5
        kappa_bright: 1.0
        pump_bright: 0.5
        kappa_dark: 0.1
    cam_solver:
      bifurcation:
        controls:
          chi:
            min: 1.0e-05
            max: 0.1
            scale: 0.01
            domain: nonnegative
            sampling: log
          pump_bright:
            min: 0.01
            max: 0.999
            scale: 1.0
            domain: nonnegative
        perturbation:
          parameter: delta
          scale: 1.0
          side: both
        target:
          equilibrium_multiplicity:
            order: 3
        strategy:
          reduced:
            retained_dimension: 1
            max_candidates: 4
            condition_limit: 100000000000.0
        discovery:
          seeds:
            samples_per_control: 3
            max_starts: 1024
            order_parameter_samples: 31
        classifier:
          scaling_signature:
            max_total_order: 8
            coefficient_tolerance: 1.0e-14
            max_exponent: 0.999
        refinement:
          tolerance: 1.0e-09
          max_iterations: 60
        verification:
          initial_digits: 40
          max_digits: 120
        audit:
          near_miss_per_reason: 8
          near_miss_total: 64
