            max: 5.0
            scale: 0.5
            domain: nonnegative
            sampling: log
          pump_bright:
            min: 0.01
            max: 0.999
            scale: 1.0
            domain: nonnegative
        perturbation:
          parameter: delta
          scale: 1.0
          side: both
        target:
          equilibrium_multiplicity:
            order: 3
        strategy:
          reduced:
            retained_dimension: 1
            max_candidates: 9
            condition_limit: 100000000000.0
        discovery:
