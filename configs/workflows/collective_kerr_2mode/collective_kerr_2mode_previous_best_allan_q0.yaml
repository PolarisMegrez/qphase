schema: qphase.workflow/2
id: collective_kerr_2mode_previous_best_allan_q0
title: Collective Kerr 2Mode Previous Best Allan Q0
collection: collective_kerr_2mode
tags:
- collective_kerr_2mode
jobs:
# Allan Q0 for the best root before the scaled-detuning completion.
- name: collective_kerr_2mode_previous_best_allan_q0_sim
  save: true
  scan:
    axes:
      delta:
        target: model.collective_kerr_2mode.delta
        values:
        - 0.038660241304069642
        - 0.060543175044552186
        - 0.072848853003227743
        - 0.079768844253875038
        - 0.083660241304069641
        - 0.0858485346781179
        - 0.087079102473985454
        - 0.087771101599050189
        - 0.088160241304069645
        - 0.089660241304069646
        - 0.090438520714108572
        - 0.091822518964238029
        - 0.094283654555973137
        - 0.09866024130406964
        - 0.10644303540445887
        - 0.12028301790575344
        - 0.14489437382310455
        - 0.18866024130406966
  engine:
    sde:
      t0: 5000.0
      t1: 25000.0
      dt: 0.005
      n_traj: 16
      seed: 20260811
      ic: [["6.920196+0.0j", "11.821222+1.758812j"]]
      adaptive: false
      save_stride: 20
      record_modes: [0]
      keep_traj: false
      trajectory_batching: auto
      max_state_norm: 100.0
      state_check_interval_steps: 1024
  backend:
    cupy: {float_dtype: float64, device: cuda}
  integrator:
    cayley_maruyama: {fused: required, chunk_steps: 256, max_modes: 16}
  model:
    collective_kerr_2mode:
      omega_0: 0.0
      delta: 0.08866024130406965
      chi: 0.0005501695761384858
      g: 0.042808918388917615
      kappa_bright: 1.0
      pump_bright: 0.9984743105676376
      kappa_dark: 0.037273364143746206
  observer:
    first_passage:
      rule: state_norm
      threshold: 80.0
      direction: above
      action: record
      check_interval_steps: 1024
      debounce_checks: 2
  analyser:
    allan_variance:
      modes: [0]
      points: 36
      min_windows: 8
      min_independent_windows: 4

- name: collective_kerr_2mode_previous_best_allan_q0_negative
  input: {from: collective_kerr_2mode_previous_best_allan_q0_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling: &allan_scaling
      scan_param: delta
      critical_value: 0.08866024130406965
      side: negative
      mode: 0
      window_selection: latest
      white_slope_min: -1.2
      white_slope_max: -0.8
      min_local_r2: 0.9
      min_tau_decades: 0.2
      min_averaging_samples: 16
      max_relative_sem: 0.5
      min_independent_windows: 8
      min_scaling_points: 5
      target_scaling_decades: 1.0
      max_scaling_reduced_chi2: 20.0
      bootstrap_samples: 500
      bootstrap_seed: 20260811
      min_frequency_rss_improvement: 0.05
      normal_form: {n: 3, k: 1, m: 0, observable_order: 1}

- name: collective_kerr_2mode_previous_best_allan_q0_positive
  input: {from: collective_kerr_2mode_previous_best_allan_q0_sim, mode: dataset}
  save: true
  engine:
    sde: {mode: analyze}
  analyser:
    allan_scaling:
      <<: *allan_scaling
      side: positive
