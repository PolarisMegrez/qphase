[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qphase-sde"
version = "2.0.0.dev0"
description = "Physics engine for QPhase: Stochastic Differential Equations in Phase Space"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Yu Xue-Hao", email = "yuxuehao23@mails.ucas.ac.cn" }
]
urls = { Homepage = "https://github.com/PolarisMegrez/qphase", Repository = "https://github.com/PolarisMegrez/qphase", Issues = "https://github.com/PolarisMegrez/qphase/issues" }
keywords = [
  "quantum optics", "SDE", "simulation", "stochastic", "phase-space"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries"
]
dependencies = [
  "numpy>=1.23",
  "qphase>=2.0.0a0,<3.0",
  "pydantic>=2.4",
  "scipy>=1.10"
]

[project.entry-points.qphase]
# Resource package manifest
"resource.sde" = "qphase_sde.manifest:MANIFEST"
# Engine
"engine.sde" = "qphase_sde.engine:Engine"
# Integrator plugin
"integrator.euler_maruyama" = "qphase_sde.integrator.euler_maruyama:EulerMaruyama"
"integrator.cayley_maruyama" = "qphase_sde.integrator.cayley_maruyama:CayleyMaruyama"
"integrator.milstein" = "qphase_sde.integrator.milstein:Milstein"
"integrator.srk" = "qphase_sde.integrator.srk:GenericSRK"
# Analyser plugin
"analyser.psd" = "qphase_sde.analyser.psd:PsdAnalyser"
"analyser.dist" = "qphase_sde.analyser.dist:DistAnalyser"
"analyser.pdist" = "qphase_sde.analyser.polar_dist:PolarDistAnalyser"
"analyser.lorentz_fitter" = "qphase_sde.analyser.lorentz_fitter:LorentzFitter"
"analyser.trajectory_diagnostics" = "qphase_sde.analyser.trajectory_diagnostics:TrajectoryDiagnostics"
"analyser.allan_variance" = "qphase_sde.analyser.allan_variance:AllanVarianceAnalyser"
"analyser.allan_scaling" = "qphase_sde.analyser.allan_scaling:AllanScalingAnalyser"
"analyser.coherence_matrix" = "qphase_sde.analyser.coherence_matrix:CoherenceMatrixAnalyser"
"analyser.coherence_carrier" = "qphase_sde.analyser.coherence_carrier:CoherenceCarrierAnalyser"
"analyser.band_limited_carrier" = "qphase_sde.analyser.band_limited_carrier:BandLimitedCarrierAnalyser"
"analyser.finite_delay_carrier" = "qphase_sde.analyser.finite_delay_carrier:FiniteDelayCarrierAnalyser"
"analyser.spectral_ridge" = "qphase_sde.analyser.spectral_ridge:SpectralRidgeAnalyser"
"analyser.peaks" = "qphase_sde.analyser.peaks:PeaksAnalyser"
"analyser.coherence_frequency" = "qphase_sde.analyser.coherence_frequency:CoherenceFrequencyAnalyser"
"analyser.peak_paths" = "qphase_sde.analyser.peak_paths:PeakPathsAnalyser"
"analyser.moment_statistics" = "qphase_sde.analyser.moment_statistics:MomentStatisticsAnalyser"
"analyser.quadratic_moments" = "qphase_sde.analyser.quadratic_moments:QuadraticMomentAnalyser"
"analyser.observable_transform" = "qphase_sde.analyser.observable_transform:ObservableTransformAnalyser"
# Observer plugin
"observer.first_passage" = "qphase_sde.observer.first_passage:FirstPassageObserver"
# PSD estimator subplugins
"spectral_estimator.periodogram" = "qphase_sde.spectral_estimator:PeriodogramEstimator"
"spectral_estimator.welch" = "qphase_sde.spectral_estimator:WelchEstimator"
"spectral_estimator.multitaper" = "qphase_sde.spectral_estimator:MultitaperEstimator"
# Peak Finder plugins
"peak_finder.scipy" = "qphase_sde.peak_finder.scipy:ScipyPeakFinder"
"peak_finder.rational" = "qphase_sde.peak_finder.rational:RationalPeakFinder"
# Peak tracker plugins
"peak_tracker.ridge" = "qphase_sde.peak_tracker.ridge:RidgePeakTracker"
# Coherence-frequency child plugins
"coherence_frequency.short_delay" = "qphase_sde.coherence_frequency.short_delay:ShortDelayCoherenceFrequency"
"coherence_frequency.band_limited" = "qphase_sde.coherence_frequency.band_limited:BandLimitedCoherenceFrequency"
"coherence_frequency.finite_delay" = "qphase_sde.coherence_frequency.finite_delay:FiniteDelayCoherenceFrequency"

[tool.setuptools.packages.find]
where = ["."]
