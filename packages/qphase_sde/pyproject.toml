[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qphase-sde"
version = "1.0.1"
description = "Physics engine for QPhase: Stochastic Differential Equations in Phase Space"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Yu Xue-Hao", email = "yuxuehao23@mails.ucas.ac.cn" }
]
urls = { Homepage = "https://github.com/PolarisMegrez/qphase", Repository = "https://github.com/PolarisMegrez/qphase", Issues = "https://github.com/PolarisMegrez/qphase/issues" }
keywords = [
  "quantum optics", "SDE", "simulation", "stochastic", "phase-space"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries"
]
dependencies = [
  "numpy>=1.23",
  "qphase>=1.0.1",
  "pydantic>=2.4",
  "scipy>=1.10"
]

[project.entry-points.qphase]
# Engine
"engine.sde" = "qphase_sde.engine:Engine"
# Integrator plugin
"integrator.euler_maruyama" = "qphase_sde.integrator.euler_maruyama:EulerMaruyama"
"integrator.cayley_maruyama" = "qphase_sde.integrator.cayley_maruyama:CayleyMaruyama"
"integrator.milstein" = "qphase_sde.integrator.milstein:Milstein"
"integrator.srk" = "qphase_sde.integrator.srk:GenericSRK"
# Analyser plugin
"analyser.psd" = "qphase_sde.analyser.psd:PsdAnalyzer"
"analyser.dist" = "qphase_sde.analyser.dist:DistAnalyzer"
"analyser.pdist" = "qphase_sde.analyser.polar_dist:PolarDistAnalyzer"
"analyser.lorentz_fitter" = "qphase_sde.analyser.lorentz_fitter:LorentzFitter"
"analyser.trajectory_diagnostics" = "qphase_sde.analyser.trajectory_diagnostics:TrajectoryDiagnostics"
"analyser.allan_variance" = "qphase_sde.analyser.allan_variance:AllanVarianceAnalyzer"
"analyser.allan_scaling" = "qphase_sde.analyser.allan_scaling:AllanScalingAnalyzer"
"analyser.coherence_matrix" = "qphase_sde.analyser.coherence_matrix:CoherenceMatrixAnalyzer"
"analyser.coherence_carrier" = "qphase_sde.analyser.coherence_carrier:CoherenceCarrierAnalyzer"
"analyser.band_limited_carrier" = "qphase_sde.analyser.band_limited_carrier:BandLimitedCarrierAnalyzer"
"analyser.finite_delay_carrier" = "qphase_sde.analyser.finite_delay_carrier:FiniteDelayCarrierAnalyzer"
"analyser.moment_statistics" = "qphase_sde.analyser.moment_statistics:MomentStatisticsAnalyzer"
"analyser.quadratic_moments" = "qphase_sde.analyser.quadratic_moments:QuadraticMomentAnalyzer"
# Observer plugin
"observer.first_passage" = "qphase_sde.observer.first_passage:FirstPassageObserver"
# PSD estimator subplugins
"spectral_estimator.periodogram" = "qphase_sde.analyser.spectral_estimator:PeriodogramEstimator"
"spectral_estimator.welch" = "qphase_sde.analyser.spectral_estimator:WelchEstimator"
"spectral_estimator.multitaper" = "qphase_sde.analyser.spectral_estimator:MultitaperEstimator"
# Peak Finder plugins
"peak_finder.scipy" = "qphase_sde.analyser.peak_finding.scipy:ScipyPeakFinder"
"peak_finder.rational" = "qphase_sde.analyser.peak_finding.rational:RationalPeakFinder"

[tool.setuptools.packages.find]
where = ["."]
