# QPhase system configuration

paths:
  output_dir: "./runs"
  global_file: "./configs/global.yaml"
  plugin_dirs:
    - "./models"
  config_dirs:
    - "./configs"

auto_save_results: true

reporting:
  progress:
    refresh_interval: 0.5
    non_tty_milestone_percent: 10.0
    eta_warmup_seconds: 2.0
    eta_min_samples: 3
    eta_smoothing: 0.25
  logging:
    session_file: true
    filename: qphase.log
    file_level: DEBUG
    console_level: WARNING
    format: text
    capture_warnings: true

scan_runtime:
  storage_layout: auto
  auto_shard_threshold_mib: 512
  shard_target_mib: 128
  checkpoint:
    enabled: false
    interval_chunks: 1
    keep_on_success: false
  resources:
    cpu_worker_limit: null
    memory_limit_mib: null
    gpu_device: null
    gpu_memory_fraction: null
