# QPhase system configuration

paths:
  output_dir: "./runs"
  global_file: "./configs/global.yaml"
  plugin_dirs:
    - "./models"
  config_dirs:
    - "./configs"

auto_save_results: true
progress_update_interval: 0.5

scan_runtime:
  storage_layout: auto
  auto_shard_threshold_mib: 512
  shard_target_mib: 128
  checkpoint:
    enabled: false
    interval_chunks: 1
    keep_on_success: false
  resources:
    cpu_worker_limit: null
    memory_limit_mib: null
    gpu_device: null
    gpu_memory_fraction: null
