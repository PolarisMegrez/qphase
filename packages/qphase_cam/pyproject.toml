[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qphase-cam"
version = "0.1.0"
description = "Workspace-only coherent-amplitude matrix engine for QPhase"
requires-python = ">=3.11"
dependencies = [
  "fpgen>=0.5.1,<0.6",
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.12",
  "qphase>=1.0.1",
]

[project.entry-points.qphase]
"engine.cam" = "qphase_cam.engine:Engine"
"cam_solver.steady_state" = "qphase_cam.solver.steady_state:SteadyStateSolver"
"cam_solver.multistability" = "qphase_cam.solver.multistability:MultistabilitySolver"
"cam_solver.deflation" = "qphase_cam.solver.deflation:DeflationSolver"
"cam_solver.batched_newton" = "qphase_cam.solver.batched_newton:BatchedNewtonSolver"
"cam_solver.continuation" = "qphase_cam.solver.continuation:ContinuationSolver"
"cam_solver.bifurcation" = "qphase_cam.solver.bifurcation:BifurcationSolver"
"bifurcation_target.equilibrium_multiplicity" = "qphase_cam.solver.bifurcation_target:EquilibriumMultiplicity"
"bifurcation_strategy.auto" = "qphase_cam.solver.bifurcation_strategy:AutoStrategy"
"bifurcation_strategy.reduced" = "qphase_cam.solver.bifurcation_strategy:ReducedStrategy"
"bifurcation_strategy.full" = "qphase_cam.solver.bifurcation_strategy:FullStrategy"
"bifurcation_discovery.seeds" = "qphase_cam.solver.bifurcation_discovery:SeedDiscovery"
"bifurcation_classifier.scaling_signature" = "qphase_cam.solver.bifurcation_classifier:ScalingSignatureClassifier"
"cam_postprocessor.rayleigh_frequency" = "qphase_cam.postprocessor.frequency:RayleighFrequency"
"cam_postprocessor.hamiltonian_spectrum" = "qphase_cam.postprocessor.frequency:HamiltonianSpectrum"
"cam_postprocessor.coherence_pole_spectrum" = "qphase_cam.postprocessor.coherence_pole:CoherencePoleSpectrum"
"cam_postprocessor.finite_delay_carrier" = "qphase_cam.postprocessor.finite_delay_carrier:CAMFiniteDelayCarrier"
"cam_postprocessor.petermann_spectrum" = "qphase_cam.postprocessor.petermann:PetermannSpectrum"
"cam_postprocessor.jacobian_spectrum" = "qphase_cam.postprocessor.jacobian:JacobianSpectrum"
"cam_postprocessor.physicality" = "qphase_cam.postprocessor.physicality:Physicality"
"cam_postprocessor.local_response_validation" = "qphase_cam.postprocessor.local_response:LocalResponseValidation"
"cam_postprocessor.stochastic_validity" = "qphase_cam.postprocessor.stochastic_validity:StochasticValidity"

[tool.setuptools.packages.find]
where = ["."]
